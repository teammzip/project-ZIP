<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 B · 화면 위 로그인 창</title>
  <link rel="stylesheet" href="login.css">
  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    #site {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    #site.locked {
      filter: blur(5px) brightness(0.9);
      pointer-events: none;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(31, 36, 48, 0.35);
      overflow: auto;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 28px 26px 22px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .card .logo {
      margin-bottom: 14px;
    }
  </style>
</head>

<body>
  <iframe id="site" class="locked" title="사이트 미리보기"></iframe>
  <div class="backdrop" id="backdrop">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="title">
      <div class="logo">ZIP<small>자취생 생활 도우미</small></div>
      <h2 id="title"></h2>
      <p class="lead" id="lead"></p>
      <form id="loginForm" novalidate>
        <label class="field" id="nickField" hidden><span>닉네임</span><input name="nick" placeholder="예: 지기"></label>
        <label class="field"><span>이메일</span><input name="email" type="email" placeholder="you@example.com" autocomplete="username"></label>
        <label class="field"><span>비밀번호</span>
          <div class="pw-row"><input name="pw" type="password" placeholder="4자 이상" autocomplete="current-password"><button type="button" id="pwToggle">보기</button></div>
        </label>
        <div class="row" id="loginOnly"><label><input type="checkbox"> 로그인 유지</label><a>비밀번호 찾기</a></div>
        <div class="error" id="error"></div>
        <button class="btn btn-main" id="submitBtn" type="submit">로그인</button>
      </form>
      <div class="divider">또는</div>
      <button class="btn btn-kakao" id="kakaoBtn" type="button">카카오로 3초 만에 시작</button>
      <div class="switch" id="switchText"></div>
      <div class="demo-note">시안용 화면이라 형식에 맞는 아무 값이나 입력하면 들어가져요.</div>
    </div>
  </div>
  <script>
    // 뒤에 깔리는 사이트 화면. 로그인에 성공하면 덮개만 치워서 같은 화면이 바로 보인다.
    var nextUrl = new URLSearchParams(location.search).get('next') || '../variants/app/index.html';
    document.getElementById('site').src = nextUrl;
    window.onLoginSuccess = function () {
      document.getElementById('backdrop').hidden = true;
      document.getElementById('site').classList.remove('locked');
    };
  </script>
  <script src="login.js"></script>
</body>

</html>
