<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 C · 그라데이션 배경</title>
  <link rel="stylesheet" href="login.css">
  <style>
    body {
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, #ff9966 0%, #ff5e62 45%, #7c6cf5 100%);
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 32px 28px 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
    }

    .card .logo {
      margin-bottom: 18px;
      text-align: center;
    }

    .card .logo small {
      display: block;
      margin: 4px 0 0;
    }

    .card h2,
    .card .lead {
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">ZIP<small>자취생 생활 도우미</small></div>
    <h2 id="title"></h2>
    <p class="lead" id="lead"></p>
    <form id="loginForm" novalidate>
      <label class="field" id="nickField" hidden><span>닉네임</span><input name="nick" placeholder="예: 지기"></label>
      <label class="field"><span>이메일</span><input name="email" type="email" placeholder="you@example.com" autocomplete="username"></label>
      <label class="field"><span>비밀번호</span>
        <div class="pw-row"><input name="pw" type="password" placeholder="4자 이상" autocomplete="current-password"><button type="button" id="pwToggle">보기</button></div>
      </label>
      <div class="row" id="loginOnly"><label><input type="checkbox"> 로그인 유지</label><span class="find-links"><a href="../variants/account/find.html#id">아이디 찾기</a><i>/</i><a href="../variants/account/find.html#pw">비밀번호 찾기</a></span></div>
      <div class="error" id="error"></div>
      <button class="btn btn-main" id="submitBtn" type="submit">로그인</button>
    </form>
    <div class="divider">또는</div>
    <button class="btn btn-kakao" id="kakaoBtn" type="button">카카오로 3초 만에 시작</button>
    <div class="switch" id="switchText"></div>
    <div class="demo-note">시안용 화면이라 형식에 맞는 아무 값이나 입력하면 들어가져요.</div>
  </div>
  <script src="login.js"></script>
</body>

</html>
