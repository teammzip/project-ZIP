<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 A · 소개 + 로그인</title>
  <link rel="stylesheet" href="login.css">
  <style>
    .page {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      min-height: 100vh;
    }

    .intro {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      padding: 48px 56px;
      background: linear-gradient(160deg, #fff4ec 0%, #ffe3d1 100%);
    }

    .intro h1 {
      font-size: 34px;
      line-height: 1.35;
      letter-spacing: -0.5px;
    }

    .intro h1 em {
      font-style: normal;
      color: var(--orange);
    }

    .intro ul {
      list-style: none;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .intro li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 15px;
      line-height: 1.5;
    }

    .intro li b {
      display: block;
      font-size: 15px;
    }

    .intro li span.ic {
      flex: none;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #fff;
      font-size: 18px;
    }

    .intro li span.tx {
      color: var(--muted);
      font-size: 13px;
    }

    .side {
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: #fff;
    }

    .card {
      width: 100%;
      max-width: 380px;
    }

    @media (max-width: 800px) {
      .page {
        grid-template-columns: 1fr;
      }

      .intro {
        padding: 28px 20px;
        gap: 14px;
      }

      .intro h1 {
        font-size: 24px;
      }

      .intro ul {
        grid-template-columns: 1fr 1fr;
      }

      .intro li span.tx {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <section class="intro">
      <div class="logo">ZIP<small>자취생 생활 도우미</small></div>
      <h1>혼자 사는 집,<br><em>할 일은 한곳에</em> 모아두세요</h1>
      <ul>
        <li><span class="ic">📅</span><div><b>일정 · 할 일</b><span class="tx">월세일과 공과금 납부일까지 한 번에 확인해요.</span></div></li>
        <li><span class="ic">🗑️</span><div><b>쓰레기 배출 요일</b><span class="tx">우리 동네 분리배출 일정을 알려줘요.</span></div></li>
        <li><span class="ic">🤖</span><div><b>AI 생활 도우미</b><span class="tx">사진을 찍으면 분리배출과 요리를 안내해요.</span></div></li>
        <li><span class="ic">🗺️</span><div><b>동네 · 이야기</b><span class="tx">주변 세탁방과 편의점, 이웃 꿀팁까지.</span></div></li>
      </ul>
    </section>

    <section class="side">
      <div class="card">
        <h2 id="title"></h2>
        <p class="lead" id="lead"></p>
        <form id="loginForm" novalidate>
          <label class="field" id="nickField" hidden><span>닉네임</span><input name="nick" placeholder="예: 지기"></label>
          <label class="field"><span>이메일</span><input name="email" type="email" placeholder="you@example.com" autocomplete="username"></label>
          <label class="field"><span>비밀번호</span>
            <div class="pw-row"><input name="pw" type="password" placeholder="4자 이상" autocomplete="current-password"><button type="button" id="pwToggle">보기</button></div>
          </label>
          <div class="row" id="loginOnly"><label><input type="checkbox"> 로그인 유지</label><a>비밀번호 찾기</a></div>
          <div class="error" id="error"></div>
          <button class="btn btn-main" id="submitBtn" type="submit">로그인</button>
        </form>
        <div class="divider">또는</div>
        <button class="btn btn-kakao" id="kakaoBtn" type="button">카카오로 3초 만에 시작</button>
        <div class="switch" id="switchText"></div>
        <div class="demo-note">시안용 화면이라 형식에 맞는 아무 값이나 입력하면 들어가져요.</div>
      </div>
    </section>
  </div>
  <script src="login.js"></script>
</body>

</html>
