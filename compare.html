<!DOCTYPE html>
<html lang="ko">
<!-- 아 깃허브좀 잘되라. -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZIP 시안 비교</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: #2b2f3a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .bar {
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 10px 16px;
      background: #1f2430;
      flex-wrap: wrap;
    }

    .group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .group>span {
      font-size: 13px;
      color: #aab0c0;
      margin-right: 4px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid #444b5c;
      background: #2b2f3a;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
    }

    button:hover {
      border-color: #ff7a45;
    }

    button.on {
      background: #ff7a45;
      border-color: #ff7a45;
      font-weight: 700;
    }

    .bar a {
      color: #9fb4c8;
      font-size: 13px;
    }

    /* 관리자 버튼: 상단 바 오른쪽 끝 */
    .admin-btn {
      margin-left: auto;
      border-color: #7c6cf5;
    }

    .admin-btn.on {
      background: #7c6cf5;
      border-color: #7c6cf5;
    }

    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    iframe {
      border: 0;
      background: #fff;
      border-radius: 8px;
      height: 100%;
      max-width: 100%;
    }
  </style>
</head>

<body>
  <div class="bar">
    <div class="group" id="vars"><span>시안</span></div>
    <div class="group" id="sizes"><span>화면</span></div>
    <a id="open" href="#" target="_blank" rel="noopener">새 탭에서 열기</a>
    <button type="button" class="admin-btn" id="adminBtn" data-v="admin">관리자</button>
  </div>
  <div class="stage">
    <iframe id="frame" title="시안 미리보기"></iframe>
  </div>

  <script>
    // 비교할 화면: [폴더 이름(variants/<이름>/index.html), 버튼 이름, 눌렀을 때 맞춰 줄 화면 크기(SIZES 번호, null이면 그대로)]
    var VARIANTS = [
      ['app', '앱 화면', null],
      ['start-mobile', '모바일시작', 2],
      ['start-pc', 'PC시작', 0],
      ['admin', '관리자', 0]   // 오른쪽 끝 버튼(#adminBtn)으로 따로 만들어서 목록에는 이름만 등록
    ];
    // [이름, 폭, 높이]  태블릿·모바일은 실제 기기 비율(768×1024, 375×812)로 맞추고, 창이 작으면 높이만 창에 맞춰 줄어듦
    var SIZES = [['데스크톱', '100%', '100%'], ['태블릿', '768px', 'min(1024px, 100%)'], ['모바일', '375px', 'min(812px, 100%)']];
    function applySize() { frame.style.width = SIZES[size][1]; frame.style.height = SIZES[size][2]; }
    var frame = document.getElementById('frame');

    function read(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } }
    function write(key, val) { try { localStorage.setItem(key, val); } catch (e) { } }
    function isVariant(id) { return VARIANTS.some(function (v) { return v[0] === id; }); }

    var fromUrl = new URLSearchParams(location.search).get('v');          // compare.html?v=start-pc 처럼 바로 열기
    var saved = fromUrl || read('compare-v', 'app');
    var cur = isVariant(saved) ? saved : 'app';   // 화면 이름
    var size = Number(read('compare-size', '0'));
    if (!(size >= 0 && size < SIZES.length)) size = 0;

    function render() {
      document.querySelectorAll('button[data-v]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === cur); });
      document.querySelectorAll('#sizes button').forEach(function (b, i) { b.classList.toggle('on', i === size); });
      var src = 'variants/' + cur + '/index.html';
      if (frame.getAttribute('src') !== src) frame.src = src;
      applySize();
      document.getElementById('open').href = src;
      document.title = 'ZIP ' + VARIANTS.filter(function (v) { return v[0] === cur; })[0][1] + ' 비교';
    }

    VARIANTS.forEach(function (v) {
      if (v[0] === 'admin') return;
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = v[1]; b.setAttribute('data-v', v[0]);
      b.addEventListener('click', function () {
        cur = v[0]; write('compare-v', cur);
        if (v[2] !== null) { size = v[2]; write('compare-size', String(size)); }   // 모바일시작은 모바일 화면, PC시작은 데스크톱 화면으로 바로 보여줌
        render();
      });
      document.getElementById('vars').appendChild(b);
    });
    SIZES.forEach(function (s, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = s[0];
      b.addEventListener('click', function () { size = i; write('compare-size', String(i)); render(); });
      document.getElementById('sizes').appendChild(b);
    });
    render();
  </script>
</body>

</html>
