<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZIP - 회원가입</title>
  <link rel="icon" type="image/png" href="../../images/app-icon.png">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="../../shared/mobile-scroll.css">
</head>

<body>
  <!-- 회원가입 전용 페이지 (PC 시작의 "회원가입" 버튼과 로그인 창 아래 "회원가입" 링크가 이 페이지로 이동). 아이디/비밀번호 찾기는 find.html. 모바일(폭 900px 이하)에서는 하늘색 바탕 없이 흰 카드만 보임 -->
  <header class="top">
    <a class="logo" href="../start-pc/index.html" data-start-home aria-label="ZIP 시작 화면으로"><img src="../../images/logo-zip.png" alt="ZIP"></a>
    <a class="to-login" href="../start-pc/index.html#login" data-start-login>이미 계정이 있나요? 로그인</a>
  </header>

  <main class="card">
    <!-- 회원가입 -->
    <section class="panel" id="panel-signup">
      <h1>회원가입</h1>
      <form id="signupForm" novalidate>

        <h2 class="sec-title">로그인 정보</h2>
        <div class="row">
          <label for="uid">아이디</label>
          <div class="cell"><input id="uid" name="uid" maxlength="16" placeholder="6~16자 / 영문 소문자, 숫자 사용 가능" autocomplete="username"></div>
        </div>
        <p class="hint" data-for="uid"></p>
        <div class="row">
          <label for="pw">비밀번호</label>
          <div class="cell">
            <input id="pw" name="pw" type="password" maxlength="16" placeholder="8~16자 / 문자, 숫자, 특수 문자 모두 혼용" autocomplete="new-password">
            <button type="button" class="eye" data-eye="pw" aria-label="비밀번호 보기"></button>
          </div>
        </div>
        <p class="hint" data-for="pw"></p>
        <div class="row">
          <label for="pw2">비밀번호 확인</label>
          <div class="cell">
            <input id="pw2" name="pw2" type="password" maxlength="16" placeholder="비밀번호를 다시 입력해 주세요" autocomplete="new-password">
            <button type="button" class="eye" data-eye="pw2" aria-label="비밀번호 확인 보기"></button>
          </div>
        </div>
        <p class="hint" data-for="pw2"></p>

        <h2 class="sec-title">회원 정보</h2>
        <div class="row">
          <label for="nick">닉네임</label>
          <div class="cell"><input id="nick" name="nick" maxlength="12" placeholder="앱에서 보여줄 이름 (2~12자)" autocomplete="nickname"></div>
        </div>
        <p class="hint" data-for="nick"></p>
        <div class="row">
          <label for="phone">휴대전화</label>
          <div class="cell">
            <span class="prefix">010 -</span>
            <input id="phone" name="phone" inputmode="numeric" maxlength="9" placeholder="0000-0000" autocomplete="tel-national">
            <button type="button" class="line-btn" id="phoneBtn">인증(필수)</button>
          </div>
        </div>
        <div class="row sub" id="codeRow" hidden>
          <label for="code">인증번호</label>
          <div class="cell">
            <input id="code" name="code" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리 (시안용: 아무 6자리)">
            <button type="button" class="line-btn" id="codeBtn">확인</button>
          </div>
        </div>
        <p class="hint" data-for="phone"></p>
        <div class="row">
          <label for="email">이메일</label>
          <div class="cell"><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div>
        </div>
        <p class="hint" data-for="email"></p>
        <div class="row">
          <label for="addr">주소</label>
          <div class="cell"><input id="addr" name="addr" placeholder="예: 서울시 마포구 합정동 123-4" autocomplete="street-address"></div>
        </div>
        <p class="hint" data-for="addr"></p>

        <h2 class="sec-title">가입 약관 동의</h2>
        <div class="agree">
          <label class="chk all"><input type="checkbox" id="agreeAll"><span>필수 약관 전체 동의</span></label>

          <div class="agree-item" data-terms="service">
            <div class="agree-head"><b>서비스 이용약관 <em class="req">[필수 동의]</em></b><button type="button" class="more" aria-expanded="false">상세보기<i></i></button></div>
            <label class="chk"><input type="checkbox" name="agreeService" data-need="1"><span><em class="req">[필수]</em> 서비스 이용약관에 동의합니다.</span></label>
            <div class="terms-box" hidden></div>
          </div>

          <div class="agree-item" data-terms="privacy">
            <div class="agree-head"><b>개인정보 처리방침 <em class="req">[안내 확인]</em></b><button type="button" class="more" aria-expanded="false">상세보기<i></i></button></div>
            <p class="notice">가입할 때 수집하는 정보와 이용 목적, 보관 기간을 안내해 드려요.</p>
            <label class="chk"><input type="checkbox" name="agreePrivacy" data-need="1"><span><em class="req">[필수]</em> 개인정보 처리방침 안내를 확인했습니다.</span></label>
            <div class="terms-box" hidden></div>
          </div>

          <div class="agree-item" data-terms="policy">
            <div class="agree-head"><b>커뮤니티·AI 운영 정책 <em class="req">[필수 동의]</em></b><button type="button" class="more" aria-expanded="false">상세보기<i></i></button></div>
            <label class="chk"><input type="checkbox" name="agreePolicy" data-need="1"><span><em class="req">[필수]</em> 커뮤니티·AI 운영 정책에 동의합니다.</span></label>
            <div class="terms-box" hidden></div>
          </div>

          <p class="age-note">14세 미만은 회원 가입이 제한됩니다.</p>
        </div>

        <div class="error" id="formError"></div>
        <button class="submit" id="submitBtn" type="submit" disabled>가입하기</button>
      </form>
      <p class="foot m-only">이미 계정이 있나요? <a href="../start-pc/index.html#login" data-start-login>로그인</a></p>
      <p class="foot">계정을 잊으셨나요? <a href="find.html#id">아이디 찾기</a> · <a href="find.html#pw">비밀번호 찾기</a></p>
    </section>
  </main>

  <script src="../../login/terms.js"></script>
  <script src="account.js"></script>
  <script src="signup.js"></script>
  <script src="../../shared/mobile-scroll.js"></script>
</body>

</html>
