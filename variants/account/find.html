<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZIP - 아이디 찾기</title>
  <link rel="icon" type="image/png" href="../../images/app-icon.png">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="../../shared/mobile-scroll.css">
</head>

<body>
  <!-- 아이디 찾기 · 비밀번호 찾기 전용 페이지 (로그인 창의 "아이디 찾기"·"비밀번호 찾기" 링크가 각각 이 페이지의 해당 탭으로 이동).
       둘 다 휴대전화 인증으로 본인을 확인하고, 비밀번호는 메일 발송 없이 이 화면에서 바로 새로 정함. 회원가입은 signup.html -->
  <header class="top">
    <a class="logo" href="../start-pc/index.html" data-start-home aria-label="ZIP 시작 화면으로"><img src="../../images/logo-zip.png" alt="ZIP"></a>
    <a class="to-login" href="../start-pc/index.html#login" data-start-login>로그인</a>
  </header>

  <main class="card">
    <nav class="tabs" role="tablist" aria-label="계정 찾기">
      <button type="button" role="tab" data-tab="id" aria-selected="true">아이디 찾기</button>
      <button type="button" role="tab" data-tab="pw" aria-selected="false">비밀번호 찾기</button>
    </nav>

    <!-- 아이디 찾기: 닉네임 + 휴대전화 인증 → 아이디를 그대로 보여 줌 -->
    <section class="panel" id="panel-id" role="tabpanel">
      <h1>아이디 찾기</h1>
      <p class="lead">가입할 때 쓴 닉네임과 휴대전화로 본인을 확인하면 아이디를 알려드려요.</p>
      <p class="demo-guide" data-kind="id" hidden></p>
      <form id="findIdForm" novalidate>
        <div class="row">
          <label for="fnick">닉네임</label>
          <div class="cell"><input id="fnick" name="nick" maxlength="12" placeholder="가입할 때 쓴 닉네임"></div>
        </div>
        <div class="row">
          <label for="fphone">휴대전화</label>
          <div class="cell">
            <span class="prefix">010 -</span>
            <input id="fphone" name="phone" inputmode="numeric" maxlength="9" placeholder="0000-0000" autocomplete="tel-national">
            <button type="button" class="line-btn" id="fphoneBtn">인증(필수)</button>
          </div>
        </div>
        <div class="row sub" id="fcodeRow" hidden>
          <label for="fcode">인증번호</label>
          <div class="cell">
            <input id="fcode" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리 (시안용: 아무 6자리)">
            <button type="button" class="line-btn" id="fcodeBtn">확인</button>
          </div>
        </div>
        <p class="hint" id="fphoneHint"></p>
        <div class="error" id="idError"></div>
        <div class="result" id="idResult" hidden>가입한 아이디는 <b id="foundId"></b> 이에요.<small><a href="#pw" data-to="pw">비밀번호도 잊으셨나요? 재설정하기</a></small></div>
        <button class="submit on" type="submit">아이디 찾기</button>
      </form>
      <p class="foot"><a href="#pw" data-to="pw">비밀번호 찾기</a> · <a href="../start-pc/index.html#login" data-start-login>로그인하러 가기</a></p>
    </section>

    <!-- 비밀번호 찾기: ① 아이디 + 휴대전화 인증으로 본인 확인 → ② 같은 화면에서 바로 새 비밀번호 입력 -->
    <section class="panel" id="panel-pw" role="tabpanel" hidden>
      <h1>비밀번호 찾기</h1>
      <p class="lead" id="lead-pw">아이디와 휴대전화로 본인을 확인한 뒤 바로 새 비밀번호를 정할 수 있어요.</p>
      <p class="demo-guide" data-kind="pw" hidden></p>

      <form id="findPwForm" novalidate>
        <div class="row">
          <label for="puid">아이디</label>
          <div class="cell"><input id="puid" name="uid" maxlength="16" placeholder="가입한 아이디" autocomplete="username"></div>
        </div>
        <div class="row">
          <label for="pphone">휴대전화</label>
          <div class="cell">
            <span class="prefix">010 -</span>
            <input id="pphone" name="phone" inputmode="numeric" maxlength="9" placeholder="0000-0000" autocomplete="tel-national">
            <button type="button" class="line-btn" id="pphoneBtn">인증(필수)</button>
          </div>
        </div>
        <div class="row sub" id="pcodeRow" hidden>
          <label for="pcode">인증번호</label>
          <div class="cell">
            <input id="pcode" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리 (시안용: 아무 6자리)">
            <button type="button" class="line-btn" id="pcodeBtn">확인</button>
          </div>
        </div>
        <p class="hint" id="pphoneHint"></p>
        <div class="error" id="pwError"></div>
        <button class="submit on" type="submit">본인 확인</button>
      </form>

      <!-- ② 본인 확인이 끝나면 위 폼 대신 나타남 -->
      <form id="resetForm" novalidate hidden>
        <div class="row">
          <label for="newPw">새 비밀번호</label>
          <div class="cell">
            <input id="newPw" name="pw" type="password" maxlength="16" placeholder="8~16자" autocomplete="new-password">
            <button type="button" class="eye" data-eye="newPw" aria-label="새 비밀번호 보기"></button>
          </div>
        </div>
        <div class="row">
          <label for="newPw2">새 비밀번호 확인</label>
          <div class="cell">
            <input id="newPw2" name="pw2" type="password" maxlength="16" placeholder="새 비밀번호를 다시 입력해 주세요" autocomplete="new-password">
            <button type="button" class="eye" data-eye="newPw2" aria-label="새 비밀번호 확인 보기"></button>
          </div>
        </div>
        <div class="error" id="resetError"></div>
        <button class="submit on" type="submit">비밀번호 재설정</button>
      </form>

      <div class="result" id="resetDone" hidden>비밀번호를 바꿨어요. 새 비밀번호로 로그인해 주세요.<small><a href="../start-pc/index.html#login" data-start-login>로그인하러 가기</a></small></div>

      <p class="foot"><a href="#id" data-to="id">아이디 찾기</a> · <a href="../start-pc/index.html#login" data-start-login>로그인하러 가기</a></p>
    </section>

    <p class="foot join">아직 계정이 없나요? <a href="signup.html">회원가입</a></p>
  </main>

  <script src="../../shared/zip-password.js"></script>
  <script src="account.js"></script>
  <script src="find.js"></script>
  <script src="../../shared/mobile-scroll.js"></script>
</body>

</html>
