<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZIP - 아이디 찾기</title>
  <link rel="icon" type="image/png" href="../../images/app-icon.png">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="../../shared/mobile-scroll.css">
</head>

<body>
  <!-- 아이디 찾기 · 비밀번호 찾기 전용 페이지 (로그인 창의 "아이디 찾기"·"비밀번호 찾기" 링크가 각각 이 페이지의 해당 탭으로 이동).
       회원가입은 signup.html -->
  <header class="top">
    <a class="logo" href="../start-pc/index.html" data-start-home aria-label="ZIP 시작 화면으로"><img src="../../images/logo-zip.png" alt="ZIP"></a>
    <a class="to-login" href="../start-pc/index.html#login" data-start-login>로그인</a>
  </header>

  <main class="card">
    <nav class="tabs" role="tablist" aria-label="계정 찾기">
      <button type="button" role="tab" data-tab="id" aria-selected="true">아이디 찾기</button>
      <button type="button" role="tab" data-tab="pw" aria-selected="false">비밀번호 찾기</button>
    </nav>

    <!-- 아이디 찾기 -->
    <section class="panel" id="panel-id" role="tabpanel">
      <h1>아이디 찾기</h1>
      <p class="lead">가입할 때 쓴 닉네임과 주소를 입력하면 가입한 아이디를 알려드려요.</p>
      <form id="findIdForm" novalidate>
        <div class="row">
          <label for="fnick">닉네임</label>
          <div class="cell"><input id="fnick" name="nick" placeholder="가입할 때 쓴 닉네임"></div>
        </div>
        <div class="row">
          <label for="faddr">주소</label>
          <div class="cell"><input id="faddr" name="addr" placeholder="가입할 때 입력한 주소"></div>
        </div>
        <div class="error" id="idError"></div>
        <div class="result" id="idResult" hidden>가입한 아이디는 <b>zi****12</b> 이에요.<small>시안용 화면이라 예시 결과가 나와요.</small></div>
        <button class="submit on" type="submit">아이디 찾기</button>
      </form>
      <p class="foot"><a href="#pw" data-to="pw">비밀번호도 잊으셨나요?</a> · <a href="../start-pc/index.html#login" data-start-login>로그인하러 가기</a></p>
    </section>

    <!-- 비밀번호 찾기 -->
    <section class="panel" id="panel-pw" role="tabpanel" hidden>
      <h1>비밀번호 찾기</h1>
      <p class="lead">아이디와 가입한 이메일을 입력하면 비밀번호를 다시 정하는 안내를 보내드려요.</p>
      <form id="findPwForm" novalidate>
        <div class="row">
          <label for="puid">아이디</label>
          <div class="cell"><input id="puid" name="uid" placeholder="가입한 아이디"></div>
        </div>
        <div class="row">
          <label for="pemail">이메일</label>
          <div class="cell"><input id="pemail" name="email" type="email" placeholder="가입할 때 입력한 이메일"></div>
        </div>
        <div class="error" id="pwError"></div>
        <div class="result" id="pwResult" hidden><b id="pwSentTo"></b> 으로 비밀번호 재설정 안내를 보냈어요.<small>시안용 화면이라 실제로 메일이 발송되지는 않아요.</small></div>
        <button class="submit on" type="submit">재설정 안내 받기</button>
      </form>
      <p class="foot"><a href="#id" data-to="id">아이디를 잊으셨나요?</a> · <a href="../start-pc/index.html#login" data-start-login>로그인하러 가기</a></p>
    </section>

    <p class="foot join">아직 계정이 없나요? <a href="signup.html">회원가입</a></p>
  </main>

  <script src="account.js"></script>
  <script src="find.js"></script>
  <script src="../../shared/mobile-scroll.js"></script>
</body>

</html>
