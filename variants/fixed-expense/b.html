<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고정 지출 B안 · 달 이동</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- B안: ‹ 10월 › 로 달을 넘기면 그 달의 월세와 공과금이 한 카드에 나옴. 지난 달로 넘기면 그 달 납부 내역이 보여서 "납부 내역 카드"가 필요 없음 -->
  <main class="page">
    <span class="ribbon">B안 <small>달 이동 (‹ 10월 ›)</small></span>
    <h1>고정 지출</h1>

    <section class="card">
      <div class="month">
        <button type="button" id="prev" aria-label="이전 달">‹</button>
        <b id="title"></b>
        <button type="button" id="next" aria-label="다음 달">›</button>
      </div>
      <div class="totals">
        <div><small>이 달 고정 지출</small><b id="tAll"></b></div>
        <div><small>납부</small><b id="tPaid"></b></div>
        <div><small>남은 금액</small><b id="tLeft"></b></div>
      </div>
      <div class="prog"><i id="bar"></i></div>
      <div class="prog-note"><span id="cnt"></span><span id="dday"></span></div>

      <ul class="list" id="list"></ul>
      <button type="button" class="add">＋ 항목 추가</button>
      <div class="btns">
        <button type="button" class="btn">월세 금액·날짜 수정</button>
        <button type="button" class="btn primary">캘린더에 월세 일정 추가</button>
      </div>
    </section>
  </main>

  <script>
    // 시안용 예시 데이터 (월별 납부 여부). 달을 넘기면 이 표를 보여 줌
    var MONTHS = [
      { y: 2026, m: 5, items: [['월세', 550000, 1, '매달 15일'], ['전기요금', 31000, 1, ''], ['가스요금', 12000, 1, ''], ['인터넷', 32000, 1, '']] },
      { y: 2026, m: 6, items: [['월세', 550000, 1, '매달 15일'], ['전기요금', 29000, 1, ''], ['가스요금', 9000, 1, ''], ['인터넷', 32000, 1, '']] },
      { y: 2026, m: 7, items: [['월세', 550000, 1, '매달 15일'], ['전기요금', 52000, 1, ''], ['가스요금', 8000, 1, ''], ['인터넷', 32000, 1, '']] },
      { y: 2026, m: 8, items: [['월세', 550000, 1, '매달 15일'], ['전기요금', 61000, 1, ''], ['가스요금', 8000, 1, ''], ['인터넷', 32000, 1, '']] },
      { y: 2026, m: 9, items: [['월세', 550000, 1, '매달 15일'], ['전기요금', 40000, 1, ''], ['가스요금', 15000, 1, ''], ['인터넷', 32000, 1, '']] },
      { y: 2026, m: 10, items: [['월세', 550000, 0, '매달 15일'], ['전기요금', 38000, 1, ''], ['가스요금', 30000, 1, ''], ['인터넷', 32000, 0, '']] }
    ];
    var idx = MONTHS.length - 1;
    function money(n) { return n.toLocaleString('ko-KR') + '원'; }

    function render() {
      var d = MONTHS[idx], total = 0, paid = 0, done = 0;
      document.getElementById('title').textContent = d.y + '년 ' + d.m + '월' + (idx === MONTHS.length - 1 ? ' (이번 달)' : '');
      document.getElementById('prev').disabled = idx === 0;
      document.getElementById('next').disabled = idx === MONTHS.length - 1;
      var ul = document.getElementById('list'); ul.innerHTML = '';
      d.items.forEach(function (it, i) {
        total += it[1]; if (it[2]) { paid += it[1]; done++; }
        var li = document.createElement('li');
        li.innerHTML = '<label class="row' + (it[2] ? ' done' : '') + '"><input type="checkbox"' + (it[2] ? ' checked' : '') + '>' +
          '<span class="name"><b>' + it[0] + '</b><small>' + (it[3] || d.m + '월 공과금') + '</small></span>' +
          '<span class="amt">' + money(it[1]) + '</span>' +
          (i === 0 && !it[2] ? '<span class="tag warn">이번 달 미납</span>' : '') + '</label>';
        li.querySelector('input').addEventListener('change', function () { it[2] = this.checked ? 1 : 0; render(); });
        ul.appendChild(li);
      });
      document.getElementById('tAll').textContent = money(total);
      document.getElementById('tPaid').textContent = money(paid);
      document.getElementById('tLeft').textContent = money(total - paid);
      document.getElementById('bar').style.width = Math.round(paid / total * 100) + '%';
      document.getElementById('cnt').textContent = d.items.length + '개 중 ' + done + '개 완료';
      document.getElementById('dday').textContent = idx === MONTHS.length - 1 ? '다음 월세 D-21 · 11/15' : '지난 달 기록';
    }
    document.getElementById('prev').addEventListener('click', function () { if (idx > 0) { idx--; render(); } });
    document.getElementById('next').addEventListener('click', function () { if (idx < MONTHS.length - 1) { idx++; render(); } });
    render();
  </script>
</body>
</html>
