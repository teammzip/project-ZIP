<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고정 지출 A안 · 이번 달 납부 체크리스트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- A안: 월세와 공과금을 "이번 달 납부 체크리스트" 카드 한 장으로 합침. 월세 줄을 누르면 자세히(납부 방법·수정)가 펼쳐지고, 지난 6개월은 점 줄로 줄임 -->
  <main class="page">
    <span class="ribbon">A안 <small>이번 달 납부 체크리스트 + 지난 6개월 점 줄</small></span>
    <h1>고정 지출</h1>

    <section class="sum">
      <div class="main"><small>이번 달 고정 지출 합계</small><b id="sumAll">650,000원</b><small>월세 550,000원 + 공과금 100,000원</small></div>
      <div><small>월세</small><b>550,000원</b><small>매달 15일 납부</small></div>
      <div><small>공과금</small><b>100,000원</b><small>3개 항목</small></div>
    </section>

    <section class="card">
      <div class="top">
        <h2>10월 납부 체크리스트</h2>
        <span class="tag" id="nextTag">다음 월세 D-21 · 11/15</span>
      </div>
      <div class="prog"><i id="bar" style="width:0"></i></div>
      <div class="prog-note"><span id="cnt"></span><span id="left"></span></div>

      <ul class="list" id="list">
        <li>
          <label class="row" data-amt="550000">
            <input type="checkbox">
            <span class="name"><b>월세</b><small>매달 15일 · 계좌이체</small></span>
            <span class="amt">550,000원</span>
            <button type="button" class="tag" data-open aria-label="월세 자세히">자세히 ▾</button>
          </label>
          <div class="more" id="more">
            <div class="chips">
              <div><small>금액</small><b>55만원</b></div>
              <div><small>다음 납부일</small><b>2026년 11월 15일 (D-21)</b></div>
              <div><small>납부 방법</small><b>계좌이체</b></div>
            </div>
            <div class="btns">
              <button type="button" class="btn primary">캘린더에 일정 추가</button>
              <button type="button" class="btn">금액·날짜 수정</button>
            </div>
          </div>
        </li>
        <li><label class="row" data-amt="38000"><input type="checkbox" checked><span class="name"><b>전기요금</b><small>10월 공과금</small></span><span class="amt">38,000원</span></label></li>
        <li><label class="row" data-amt="30000"><input type="checkbox" checked><span class="name"><b>가스요금</b><small>10월 공과금</small></span><span class="amt">30,000원</span></label></li>
        <li><label class="row" data-amt="32000"><input type="checkbox"><span class="name"><b>인터넷</b><small>10월 공과금</small></span><span class="amt">32,000원</span></label></li>
      </ul>
      <button type="button" class="add">＋ 항목 추가</button>

      <div class="hr"></div>
      <p class="sec-title">지난 6개월 월세</p>
      <div class="dots">
        <span><i class="late"></i>5월</span><span><i class="late"></i>6월</span><span><i class="late"></i>7월</span>
        <span><i class="late"></i>8월</span><span><i class="late"></i>9월</span><span><i class="now"></i>10월</span>
      </div>
      <p class="muted" style="font-size:12px;margin-top:10px">● 납부 완료 &nbsp; ○ 미납 &nbsp; ◌ 이번 달</p>
    </section>
  </main>

  <script>
    var rows = [].slice.call(document.querySelectorAll('.row'));
    function money(n) { return n.toLocaleString('ko-KR') + '원'; }
    function update() {
      var total = 0, paid = 0, done = 0;
      rows.forEach(function (r) {
        var a = Number(r.getAttribute('data-amt')), on = r.querySelector('input').checked;
        total += a; if (on) { paid += a; done++; }
        r.classList.toggle('done', on);
      });
      document.getElementById('bar').style.width = Math.round(paid / total * 100) + '%';
      document.getElementById('cnt').textContent = rows.length + '개 중 ' + done + '개 완료';
      document.getElementById('left').textContent = '남은 금액 ' + money(total - paid);
    }
    rows.forEach(function (r) { r.querySelector('input').addEventListener('change', update); });
    document.querySelector('[data-open]').addEventListener('click', function (e) {
      e.preventDefault();
      var m = document.getElementById('more'), open = m.classList.toggle('open');
      this.textContent = open ? '접기 ▴' : '자세히 ▾';
    });
    update();
  </script>
</body>
</html>
