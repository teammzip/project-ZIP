<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZIP - 자취생 생활 도우미 (모바일 시작)</title>
  <link rel="stylesheet" href="../../login/login.css">
  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 0;
      background: rgb(221, 235, 217);   /* 집 그림(집2.png)의 배경색과 같게 해서 그림 가장자리가 티 나지 않음 */
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: rgb(221, 235, 217);
    }

    /* 줌인할 때 함께 확대되는 풍경(집·로봇) */
    #world {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #houseImg {
      position: absolute;
      max-width: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 문이 열릴 때만 보이는 것: 문 뒤의 따뜻한 실내, 그리고 왼쪽 경첩으로 안쪽으로 열리는 문짝 */
    #doorway,
    #doorPanel,
    .wglow,
    .door-hit {
      position: absolute;
    }

    #doorway,
    #doorPanel {
      visibility: hidden;
      pointer-events: none;
    }

    #doorway {
      background: radial-gradient(ellipse at 50% 92%, #ffe2a8 0%, #e3a050 30%, #8a4f22 62%, #3a2214 100%);
      box-shadow: inset 0 0 14px rgba(0, 0, 0, .55);
    }

    #doorPanel {
      background-repeat: no-repeat;
      transform-origin: left center;
      backface-visibility: hidden;
      box-shadow: 4px 0 10px rgba(0, 0, 0, .25);
    }

    /* 로봇이 들어간 뒤 켜지는 창문 불빛 */
    .wglow {
      pointer-events: none;
      opacity: 0;
      border-radius: 4px;
      background: rgba(255, 226, 120, .6);
      box-shadow: 0 0 22px 8px rgba(255, 210, 90, .65);
    }

    /* 문 누르기 유도: 문 전체가 반짝이는 테두리 + "눌러서 입장" 표시 */
    .door-hit {
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      animation: ring 1.6s ease-out infinite;
      -webkit-tap-highlight-color: transparent;
    }

    .door-hit:hover {
      background: rgba(255, 255, 255, .12);
    }

    .door-hit:focus-visible {
      outline: 3px solid #1f2430;
      outline-offset: 3px;
    }

    .door-hit.off {
      animation: none;
      pointer-events: none;
    }

    @keyframes ring {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 122, 69, .8);
      }

      70%,
      100% {
        box-shadow: 0 0 0 16px rgba(255, 122, 69, 0);
      }
    }

    .door-label {
      position: absolute;
      left: 50%;
      bottom: 22%;
      transform: translateX(-50%);
      padding: .55em .9em;
      border-radius: 999px;
      background: #fff;
      color: #ff5a1f;
      font-size: calc(13px / var(--z, 1));   /* 줌인해도 글자 크기는 그대로 */
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
      animation: bounce 1s ease-in-out infinite;
    }

    .door-label::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      margin-left: -6px;
      border: 6px solid transparent;
      border-top-color: #fff;
    }

    .door-hit.off .door-label {
      display: none;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translate(-50%, 0);
      }

      50% {
        transform: translate(-50%, -8px);
      }
    }

    /* 로봇 */
    #robot {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform, opacity;
      pointer-events: none;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .18));
    }

    /* 글 */
    .tag {
      position: absolute;
      left: 12px;
      top: 10px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .8);
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
    }

    .caption {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 48px;
      text-align: center;
      font-size: clamp(18px, 5.4vw, 26px);
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -.3px;
      color: #123b5c;
    }

    .caption.swap {
      animation: pop .5s ease-out;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* 회원가입: 화면 아래 가운데. 누르면 별도 가입 페이지(variants/account/signup.html)로 이동 */
    .signup-btn {
      position: absolute;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #1f2430;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(31, 36, 48, .18);
      cursor: pointer;
    }

    .signup-btn b {
      margin-left: 4px;
      color: #2f80ed;
      font-weight: 800;
    }

    /* 모션 건너뛰기: 모션이 도는 동안만 왼쪽 위에 보임 (화면 아무 곳이나 눌러도 건너뛰어짐) */
    .skip {
      position: absolute;
      left: 14px;
      top: 8px;
      z-index: 5;
      padding: 6px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: rgba(31, 36, 48, .55);
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }

    .skip[hidden] {
      display: none;
    }

    .replay {
      position: absolute;
      right: 14px;
      top: 8px;
      width: auto;
      padding: 6px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: #ff7a45;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }

    /* 앱 시작 화면(스플래시): 처음 열 때 아이콘 + 이름을 잠깐 보여 준 뒤 사라지고 모션이 시작됨 */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #fff;
      transition: opacity .55s ease;
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    #splash .s-icon {
      width: clamp(96px, 30vw, 132px);
      height: auto;
      border-radius: 28%;
      box-shadow: 0 14px 30px rgba(47, 128, 237, .35);
      animation: sIcon .8s cubic-bezier(.2, .9, .3, 1.25) both;
    }

    #splash .s-name {
      margin-top: 18px;
      font-size: clamp(38px, 12vw, 52px);
      font-weight: 900;
      letter-spacing: -.04em;
      color: #1f2a44;
      animation: sUp .6s ease .45s both;
    }

    #splash .s-sub {
      font-size: 15px;
      font-weight: 700;
      color: #2f80ed;
      animation: sUp .6s ease .7s both;
    }

    #splash .s-tag {
      margin-top: 4px;
      font-size: 13px;
      letter-spacing: .14em;
      color: #6b7280;
      animation: sUp .6s ease .95s both;
    }

    @keyframes sIcon {
      from {
        opacity: 0;
        transform: scale(.55) rotate(-8deg);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes sUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* 로그인 창: 문을 누르면 아래에서 올라옴 */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 16px;
      overflow: auto;
      background: rgba(31, 36, 48, .45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 28px 26px 22px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
      transform: translateY(40px) scale(.96);
      transition: transform .35s cubic-bezier(.2, .9, .3, 1.2);
    }

    .modal.open .card {
      transform: none;
    }

    .modal .card .logo {
      margin-bottom: 18px;
      text-align: center;
    }

    .modal .card .logo img {
      display: block;
      height: 72px;
      width: auto;
      margin: 0 auto;
    }

    .modal .close {
      position: absolute;
      right: 10px;
      top: 8px;
      width: 36px;
      height: 36px;
      font-size: 26px;
      line-height: 1;
      color: #6b7280;
      background: none;
      border: 0;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <!-- 집 그림 장면: 집·문·로봇·창문 불빛이 들어 있고, 줌인할 때 함께 확대됨 -->
  <div class="scene" id="scene">
    <div id="world">
      <img id="houseImg" src="../../images/집2.png" alt="ZIP 집" draggable="false">
      <div id="doorway"></div>
      <div id="doorPanel"></div>
      <button class="door-hit" id="door" type="button" aria-label="문을 눌러 로그인하기"><span class="door-label">눌러서 입장</span></button>
      <img id="robot" alt="ZIP 도우미 로봇" src="../../images/robot-cut.png">
    </div>
    <!-- 확대되지 않는 글자와 버튼 -->
    <span class="tag">모바일 시작</span>
    <button class="replay" id="replay" type="button">다시 보기</button>
    <button class="skip" id="skip" type="button" hidden>건너뛰기 ›</button>
    <p class="caption" id="caption"></p>
    <button class="signup-btn" id="btnSignup" type="button">처음이세요? <b>회원가입</b></button>
  </div>

  <div id="splash" role="img" aria-label="ZIP 자취생 생활 도우미">
    <img class="s-icon" src="../../images/app-icon.png" alt="">
    <div class="s-name">ZIP</div>
    <div class="s-sub">자취생 생활 도우미</div>
    <div class="s-tag">나의 자취 생활을 한곳에.</div>
  </div>

  <!-- 로그인 창(모달): 문 모션이 끝나면 아래에서 올라옴. 가입은 별도 페이지로 이동하는 링크만 있음 -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-label="로그인">
      <button class="close" id="closeBtn" type="button" aria-label="닫기">×</button>
      <div class="logo"><img src="../../images/logo-zip.png" alt="ZIP"></div>
      <form id="loginForm" novalidate>
        <label class="field"><span>이메일</span><input name="email" type="email" placeholder="you@example.com" autocomplete="username"></label>
        <label class="field"><span>비밀번호</span>
          <div class="pw-row"><input name="pw" type="password" placeholder="4자 이상" autocomplete="current-password"><button type="button" id="pwToggle">보기</button></div>
        </label>
        <div class="row"><label><input type="checkbox"> 로그인 유지</label><span class="find-links"><a href="../account/find.html#id">아이디 찾기</a><i>/</i><a href="../account/find.html#pw">비밀번호 찾기</a></span></div>
        <div class="error" id="error"></div>
        <button class="btn btn-main" id="submitBtn" type="submit">로그인</button>
      </form>
      <div class="divider">또는</div>
      <div class="social">
        <button class="social-btn kakao" type="button" data-provider="kakao" aria-label="카카오로 로그인" title="카카오"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 4C6.9 4 3 7.2 3 11.1c0 2.5 1.6 4.7 4.1 6l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.3 0 .6.1.9.1 5.1 0 9-3.2 9-7.2S17.1 4 12 4z"/></svg></button>
        <button class="social-btn google" type="button" data-provider="google" aria-label="구글로 로그인" title="구글"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18A10.99 10.99 0 0 0 1 12c0 1.77.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg></button>
        <button class="social-btn naver" type="button" data-provider="naver" aria-label="네이버로 로그인" title="네이버"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M15.3 12.6 8.4 4H4v16h4.7v-8.6L15.6 20H20V4h-4.7z"/></svg></button>
      </div>
      <div class="switch" id="switchText"></div>
      <div class="demo-note">시안용 화면이라 형식에 맞는 아무 값이나 입력하면 들어가져요.</div>
    </div>
  </div>

  <script>
    window.LOGIN_NEXT = '../app/index.html';   // 로그인에 성공하면 이동할 화면 (주소 끝에 ?next=... 로 바꿀 수 있음)
    window.SIGNUP_URL = '../account/signup.html';   // 회원가입은 모달이 아니라 별도 페이지(흰 화면)로 이동
  </script>
  <script src="../../shared/zip-password.js"></script>
  <script src="../../shared/zip-ban.js"></script>
  <script src="../../login/login.js"></script>
  <!-- 모바일 시작 화면의 모션: 시작 화면(아이콘) → 로봇 등장 → 줌인 → 문 누르기 → 문 열림·입장 → 로그인 창. 시간 흐름은 T_* 값, 그림 속 좌표는 DOOR·WINDOWS -->
  <script>
    (function () {
      // 집2.png(1448×1086) 안의 위치(그림 기준 픽셀)
      var IMG_W = 1448, IMG_H = 1086, GROUND_Y = 950;                   // GROUND_Y: 집이 서 있는 바닥 아래 끝
      var HOUSE_W = 830;                                                // 지붕 끝에서 끝까지(여유 포함): 이 폭이 화면 폭에 맞음
      var DOOR = { x1: 672, y1: 608, x2: 777, y2: 830 };                // 현관문(갈색 문짝)
      var WINDOWS = [[427, 596, 558, 792], [888, 596, 1022, 792], [673, 368, 776, 458]];   // 양쪽 창문, 위쪽 다락 창문
      // 시간(초): 로봇 등장 → 줌인 → (문 클릭) 문 열림 + 로봇이 문 앞으로 → 안으로 들어감 → 문 닫힘 → 창문 불빛 → 로그인 창
      var T_ENTER = 1.3, T_ZOOM = 1.5, T_DESC = 1.2, T_IN = 1.1, T_LIGHT = 0.8;
      var T_OPEN_AT = 0.2, T_OPEN = 0.8, T_CLOSE_AT = T_DESC + T_IN + 0.1;

      var $ = function (id) { return document.getElementById(id); };
      var world = $('world'), img = $('houseImg'), robot = $('robot'), cap = $('caption'), door = $('door'), modal = $('modal');
      var doorway = $('doorway'), panel = $('doorPanel'), skipBtn = $('skip');
      var wglows = WINDOWS.map(function () { var e = document.createElement('div'); e.className = 'wglow'; world.insertBefore(e, door); return e; });
      var vw, vh, s, ox, oy, groundY, R, RH, Z = 2.6, mx = 0, my = 0, capKey = '';
      var tStart = 0, tClick = -1, opened = false, raf = 0, splashTimer = 0;
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

      var clamp = function (v) { return Math.max(0, Math.min(1, v)); };
      var lerp = function (a, b, p) { return a + (b - a) * p; };
      var easeOut = function (p) { return 1 - Math.pow(1 - p, 3); };
      var easeInOut = function (p) { return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
      function place(el, x, y, w, h) { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px'; }

      // 화면 크기에 맞춰 집 그림·문·창문·로봇의 위치와 크기를 계산
      function layout() {
        vw = window.innerWidth; vh = window.innerHeight;
        s = Math.min(vw / HOUSE_W, vh * 0.62 / 700);                      // 집 폭이 화면 폭에 맞게(너무 크면 높이 기준)
        groundY = vh * 0.8;
        ox = vw / 2 - IMG_W / 2 * s; oy = groundY - GROUND_Y * s;
        place(img, ox, oy, IMG_W * s, IMG_H * s);
        var dx = ox + DOOR.x1 * s, dy = oy + DOOR.y1 * s, dw = (DOOR.x2 - DOOR.x1) * s, dh = (DOOR.y2 - DOOR.y1) * s;
        [door, doorway, panel].forEach(function (e) { place(e, dx, dy, dw, dh); });
        panel.style.backgroundImage = 'url("' + img.getAttribute('src') + '")';   // 문 부분을 그림에서 그대로 오려 열리는 문짝으로 씀
        panel.style.backgroundSize = (IMG_W * s) + 'px ' + (IMG_H * s) + 'px';
        panel.style.backgroundPosition = (-DOOR.x1 * s) + 'px ' + (-DOOR.y1 * s) + 'px';
        WINDOWS.forEach(function (w, i) { place(wglows[i], ox + w[0] * s, oy + w[1] * s, (w[2] - w[0]) * s, (w[3] - w[1]) * s); });
        R = Math.max(46, Math.min(110, dw * 1.3)); RH = R * 498 / 473;     // 로봇은 문 폭의 1.3배 정도
        robot.style.width = R + 'px'; robot.style.height = RH + 'px';
        mx = dx + dw / 2; my = dy + dh / 2;
        Z = Math.max(1.6, Math.min(3.2, vw * 0.5 / dw));                   // 줌인: 문 폭이 화면의 절반 가까이(최대 3.2배)
      }

      // 로봇 아래 글(말풍선)을 바꿈
      function setCaption(key, text) {
        if (key === capKey) return; capKey = key; cap.textContent = text;
        cap.classList.remove('swap'); void cap.offsetWidth; cap.classList.add('swap');
      }

      // 한 프레임을 그림: 지금 시간 t에 맞춰 로봇 위치·크기, 문이 열리는 각도, 줌인, 창문 불빛을 정함
      function frame(t) {
        var doorCx = mx, doorLeft = ox + DOOR.x1 * s, doorBottom = oy + DOOR.y2 * s;
        var hoverX = doorLeft - R * .15, hoverY = doorBottom - RH * .8;    // 문 바로 옆
        var tgtX = doorCx, tgtY = doorBottom - RH * .3;
        var cx, cy, sc = 1, op = 1, rot = 0, bob = Math.sin(t * 3.2) * 6, glowW = 0, shade = 1;

        if (tClick < 0) {                                                 // 문을 누르기 전
          if (t < T_ENTER) {                                              // 오른쪽 위에서 날아 들어옴
            var p = easeOut(clamp(t / T_ENTER));
            cx = lerp(vw + R, hoverX, p); cy = lerp(vh * .2, hoverY, p) + bob * p; rot = (1 - p) * -14;
            setCaption('hi', '안녕, 나는 ZIP 도우미야');
          } else {                                                        // 집 옆에서 둥둥 떠서 문을 가리킴
            cx = hoverX; cy = hoverY + bob; rot = Math.sin(t * 3.2) * 4;
            setCaption('idle', '문을 눌러서 들어와 봐요');
          }
        } else {                                                          // 문을 누른 뒤
          var u0 = t - tClick;
          setCaption('go', '들어갈게요!');
          if (u0 < T_DESC) {                                              // 문 앞으로 내려옴
            var q = easeInOut(u0 / T_DESC);
            cx = lerp(hoverX, tgtX, q) + Math.sin(q * Math.PI) * -R * .35; cy = lerp(hoverY, tgtY, q);
            sc = lerp(1, .62, q); rot = Math.sin(q * Math.PI * 2) * 8;
          } else if (u0 < T_DESC + T_IN) {                                // 열린 문 안쪽으로 멀어지듯 작아지고 어두워짐
            var u = easeInOut((u0 - T_DESC) / T_IN);
            cx = tgtX; cy = tgtY - u * RH * .2; sc = lerp(.62, .2, u); op = u < .7 ? 1 : 1 - (u - .7) / .3; shade = 1 - .55 * u;
          } else { cx = tgtX; cy = tgtY; sc = .2; op = 0; shade = .45; }
          var openP = easeInOut(clamp((u0 - T_OPEN_AT) / T_OPEN)), closeP = easeInOut(clamp((u0 - T_CLOSE_AT) / T_OPEN));
          panel.style.transform = 'perspective(' + (700 * s) + 'px) rotateY(' + (82 * openP * (1 - closeP)) + 'deg)';
          glowW = clamp((u0 - T_CLOSE_AT - T_OPEN) / T_LIGHT);
          if (!opened && u0 > T_CLOSE_AT + T_OPEN + T_LIGHT * .7) openModal();
        }
        robot.style.transform = 'translate(' + (cx - R / 2) + 'px,' + (cy - RH / 2) + 'px) rotate(' + rot + 'deg) scale(' + sc + ')';
        robot.style.opacity = op;
        robot.style.filter = 'drop-shadow(0 6px 8px rgba(0,0,0,.18)) brightness(' + shade + ')';
        // 줌인: 로봇이 문 옆에 오면 화면이 문 쪽으로 확대되고, 문을 누른 뒤에도 확대된 채로 유지
        var zp = tClick < 0 ? easeInOut(clamp((t - T_ENTER) / T_ZOOM)) : 1, z = lerp(1, Z, zp);
        world.style.transform = 'translate(' + lerp(0, vw * 0.6 - Z * mx, zp) + 'px,' + lerp(0, vh * 0.55 - Z * my, zp) + 'px) scale(' + z + ')';
        world.style.setProperty('--z', z);
        var flick = glowW * (.9 + Math.sin(t * 5) * .05);
        wglows.forEach(function (e) { e.style.opacity = flick; });
        skipBtn.hidden = opened || (tClick < 0 && t >= T_ENTER + T_ZOOM);   // 모션이 도는 동안만 건너뛰기 표시
      }

      // 화면이 갱신될 때마다 frame 을 부름
      function loop(now) { frame((now - tStart) / 1000); raf = requestAnimationFrame(loop); }

      // 로그인 창을 엶 (이메일 칸에 커서)
      function openModal() {
        opened = true; modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false');
        var em = modal.querySelector('input[name=email]'); setTimeout(function () { em.focus(); }, 350);
      }
      // 로그인 창을 닫고 모션을 처음부터 다시 재생
      function closeModal() { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); play(); }

      // 문을 누르면 문 열림 모션을 시작
      function onDoor() {
        if (tClick >= 0) return;
        tClick = (performance.now() - tStart) / 1000;
        door.classList.add('off');
        doorway.style.visibility = panel.style.visibility = 'visible';
        if (reduce) { opened = true; wglows.forEach(function (e) { e.style.opacity = 1; }); openModal(); }
      }

      // 모션을 처음부터 재생
      function play() {
        cancelAnimationFrame(raf); tClick = -1; opened = false; capKey = ''; door.classList.remove('off');
        doorway.style.visibility = panel.style.visibility = 'hidden'; panel.style.transform = 'none';
        tStart = performance.now() - (reduce ? 3000 : 0);                 // 움직임 줄이기 설정이면 인트로를 건너뜀
        raf = requestAnimationFrame(loop);
      }

      /* 건너뛰기: 시작 화면 → 바로 모션 / 로봇 등장·줌인 → 문 앞 대기 상태 / 문 열림·입장 → 바로 로그인 창 */
      function skip() {
        if (opened) return;
        var now = (performance.now() - tStart) / 1000;
        if (splash && splash.parentNode && !splash.classList.contains('hide')) { clearTimeout(splashTimer); endSplash(); return; }
        if (tClick < 0) { if (now < T_ENTER + T_ZOOM) tStart = performance.now() - (T_ENTER + T_ZOOM) * 1000; }
        else { tClick = now - (T_CLOSE_AT + T_OPEN + T_LIGHT); }          // 문이 닫히고 창문에 불이 켜진 뒤 모습으로 바로 넘어가 로그인 창을 띄움
      }
      skipBtn.addEventListener('click', function (e) { e.stopPropagation(); skip(); });
      document.addEventListener('click', function (e) {                    // 화면 아무 곳이나 누르면 건너뜀 (문·버튼·로그인 창은 제외)
        if (e.target.closest('#door, #btnSignup, #replay, #skip, #modal')) return;
        skip();
      });
      door.addEventListener('click', onDoor);
      $('btnSignup').addEventListener('click', function () { location.href = '../account/signup.html'; });   // 회원가입은 별도 페이지로
      $('replay').addEventListener('click', function () { modal.classList.remove('open'); play(); });
      $('closeBtn').addEventListener('click', closeModal);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && opened) closeModal(); });
      window.addEventListener('resize', layout);
      // 처음 열 때만 시작 화면(아이콘 + 이름)을 SPLASH_MS 동안 보여 준 뒤, 사라지는 동안 모션을 시작. '다시 보기'는 시작 화면 없이 모션만 다시 재생
      var SPLASH_MS = 2000, splash = $('splash');
      // 가입·찾기 화면에서 "로그인"으로 돌아오면(#login) 시작 화면은 건너뛰고, 로봇이 나타나 줌인된 뒤 문이 저절로 열리고 로봇이 들어가며 로그인 창이 뜸
      var AUTO_DOOR_S = T_ENTER + T_ZOOM + 0.2;
      function begin() {
        layout(); robot.style.opacity = 0;
        if (location.hash === '#login') {
          splash.remove(); play();
          setTimeout(onDoor, reduce ? 0 : AUTO_DOOR_S * 1000);
          try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }   // 새로고침해도 또 자동으로 열리지 않게 #login 을 지움
          return;
        }
        if (reduce) { splash.remove(); play(); return; }               // 움직임 줄이기 설정이면 시작 화면 생략
        splashTimer = setTimeout(endSplash, SPLASH_MS);
      }
      function endSplash() {
        splash.classList.add('hide'); play();
        setTimeout(function () { splash.remove(); }, 700);
      }
      layout();
      if (img.complete) begin(); else img.onload = begin;
    })();
  </script>
</body>

</html>
