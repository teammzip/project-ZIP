<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZIP - 이용 정지 안내</title>
  <!-- 이용 정지 화면: 정지된 계정은 앱 기능에 들어갈 수 없고 이 안내만 보인다. 메뉴·이동 링크 없이 로그아웃과 문의만 가능.
       정지 기록(shared/zip-ban.js)이 있으면 그 내용을, 없으면 예시 값을 보여 준다. -->
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: #f4f5f9;
      color: #1f2430;
    }
    .box {
      width: 100%;
      max-width: 440px;
      padding: 32px 26px 24px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 10px 40px rgba(31, 36, 48, .12);
      text-align: center;
    }
    .ico {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fdecec;
      font-size: 30px;
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .lead { font-size: 14px; line-height: 1.6; color: #6b7280; }
    dl { margin: 20px 0 6px; text-align: left; border: 1px solid #eef0f5; border-radius: 12px; overflow: hidden; }
    dl div { display: flex; gap: 12px; padding: 11px 14px; font-size: 14px; }
    dl div + div { border-top: 1px solid #eef0f5; }
    dt { flex: none; width: 76px; color: #6b7280; }
    dd { flex: 1; font-weight: 600; word-break: keep-all; }
    dd.bad { color: #e5484d; }
    .note { margin-top: 14px; font-size: 12px; line-height: 1.6; color: #8a90a0; }
    .actions { display: flex; gap: 8px; margin-top: 20px; }
    .actions a, .actions button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .line { border: 1px solid #d9dde7; background: #fff; color: #1f2430; }
    .main { border: 0; background: #1f2430; color: #fff; }
  </style>
</head>
<body>
  <main class="box" role="alert">
    <div class="ico" aria-hidden="true">🚫</div>
    <h1>이용이 정지된 계정이에요</h1>
    <p class="lead" id="lead">운영 정책을 위반해 서비스 이용이 제한되었어요.<br>정지 기간 동안에는 로그인·글쓰기 등 모든 기능을 사용할 수 없어요.</p>
    <dl>
      <div><dt>정지 기간</dt><dd class="bad" id="term">-</dd></div>
      <div><dt>사유</dt><dd id="why">-</dd></div>
      <div><dt>정지 횟수</dt><dd id="cnt">-</dd></div>
    </dl>
    <p class="note" id="note"></p>
    <div class="actions">
      <a class="line" href="mailto:help@zip.example?subject=이용 정지 문의">문의하기</a>
      <button type="button" class="main" id="logout">로그아웃</button>
    </div>
  </main>
  <script src="../../shared/zip-password.js"></script>
  <script src="../../shared/zip-ban.js"></script>
  <script>
    (function () {
      var rec = null;
      try { rec = window.ZipBan && ZipBan.meActive(); } catch (e) { }
      var perm, until, why, count;
      if (rec) {
        var bans = (rec.history || []).filter(function (e) { return !e.warn; });
        perm = rec.perm; until = rec.until; count = rec.count || bans.length || 1;
        why = bans.length && bans[bans.length - 1].reason || '운영 정책 위반';
      } else {   // 기록이 없으면 보여주기용 예시 (3일 정지)
        perm = false; until = Date.now() + 3 * 86400000; why = '커뮤니티 운영 정책 위반(욕설·비방)'; count = 2;
      }
      document.getElementById('term').textContent = perm ? '영구 정지' : (ZipBan ? ZipBan.fmt(until) : '') + ' 해제 (' + Math.max(1, Math.ceil((until - Date.now()) / 86400000)) + '일 남음)';
      document.getElementById('why').textContent = why;
      document.getElementById('cnt').textContent = count + '회';
      document.getElementById('note').textContent = perm
        ? '영구 정지는 자동으로 풀리지 않아요. 이의가 있으면 문의하기로 알려 주세요.'
        : '정지 기간이 끝나면 자동으로 다시 이용할 수 있어요. 이의가 있으면 문의하기로 알려 주세요.';
      // 로그아웃: 시작 화면으로 (시안 폴더 기준)
      document.getElementById('logout').addEventListener('click', function () { location.href = window.innerWidth <= 900 ? '../start-mobile/index.html' : '../start-pc/index.html'; });
    })();
  </script>
</body>
</html>
