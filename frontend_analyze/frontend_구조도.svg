<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="1090" fill="#f8fafc"/>

  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">ZIP frontend/src 구조도</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" fill="#64748b">화면(pages)은 얇게, 실제 로직과 부품은 기능(features)별로 모아 둔 구조</text>

  <!-- main -->
  <rect x="470" y="90" width="260" height="42" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="600" y="117" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">main.tsx  (앱 시작점)</text>
  <line x1="600" y1="132" x2="600" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- app -->
  <rect x="60" y="160" width="1080" height="78" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="84" y="188" font-size="18" font-weight="700" fill="#4c1d95">app/  앱 전체 설정</text>
  <text x="84" y="214" font-size="14" fill="#334155">router.tsx = 주소별 화면 연결  ·  guards.tsx = 로그인/약관동의/첫 로그인/이용정지 가드  ·  setupApi.ts = 토큰 연결</text>
  <line x1="600" y1="238" x2="600" y2="266" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- pages -->
  <rect x="60" y="268" width="300" height="300" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="84" y="298" font-size="18" font-weight="700" fill="#1e3a8a">pages/  화면 (주소별 폴더)</text>
  <text x="84" y="328" font-size="14" fill="#334155">home       홈</text>
  <text x="84" y="350" font-size="14" fill="#334155">auth       로그인 · 가입 · 찾기 · 소셜</text>
  <text x="84" y="372" font-size="14" fill="#334155">ai         AI 상담</text>
  <text x="84" y="394" font-size="14" fill="#334155">map        동네 지도</text>
  <text x="84" y="416" font-size="14" fill="#334155">community  커뮤니티</text>
  <text x="84" y="438" font-size="14" fill="#334155">my         일정 · 가계 · 메모 · 설정</text>
  <text x="84" y="460" font-size="14" fill="#334155">onboarding 첫 로그인 설문</text>
  <text x="84" y="482" font-size="14" fill="#334155">legal      이용약관 · 개인정보</text>
  <text x="84" y="504" font-size="14" fill="#334155">admin      관리자</text>
  <text x="84" y="526" font-size="14" fill="#334155">start · suspended · NotFound</text>
  <text x="84" y="552" font-size="13" fill="#1e40af">내용은 얇음: features 부품을 배치만 함</text>

  <!-- features -->
  <rect x="420" y="268" width="400" height="300" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="444" y="298" font-size="18" font-weight="700" fill="#14532d">features/  기능별 묶음 (로직 + 부품)</text>
  <text x="444" y="328" font-size="14" fill="#334155">auth        로그인 · 가짜(mock)/진짜 API</text>
  <text x="444" y="350" font-size="14" fill="#334155">life        달력 · 고정지출 · 기념일 · 가계부</text>
  <text x="444" y="372" font-size="14" fill="#334155">weather     날씨 (Open-Meteo)</text>
  <text x="444" y="394" font-size="14" fill="#334155">map         지도 (Leaflet + OSM)</text>
  <text x="444" y="416" font-size="14" fill="#334155">ai          AI 상담 (예시 답변)</text>
  <text x="444" y="438" font-size="14" fill="#334155">community   커뮤니티 · memo 메모 · loan 대출</text>
  <text x="444" y="460" font-size="14" fill="#334155">onboarding  첫 로그인 설문</text>
  <text x="444" y="482" font-size="14" fill="#334155">admin · moderation · support  관리 · 신고 · 문의</text>
  <text x="444" y="504" font-size="14" fill="#334155">legal · profile · brand  약관 · 프로필 · 시작화면</text>
  <text x="444" y="530" font-size="13" fill="#166534">작은 기능(weather · loan · support)은 파일만 나란히</text>
  <text x="444" y="552" font-size="13" fill="#166534">기능 하나 = 폴더 하나, 필요한 걸 다 모아 둠</text>

  <!-- components -->
  <rect x="880" y="268" width="260" height="300" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="904" y="298" font-size="18" font-weight="700" fill="#78350f">components/  공용 부품</text>
  <text x="904" y="332" font-size="15" font-weight="700" fill="#334155">ui/</text>
  <text x="904" y="354" font-size="14" fill="#334155">Button · Card · Modal</text>
  <text x="904" y="376" font-size="14" fill="#334155">TextField · Checkbox</text>
  <text x="904" y="398" font-size="14" fill="#334155">AmountInput · TabNav ...</text>
  <text x="904" y="436" font-size="15" font-weight="700" fill="#334155">layout/</text>
  <text x="904" y="458" font-size="14" fill="#334155">AppLayout (PC 사이드바</text>
  <text x="904" y="478" font-size="14" fill="#334155">  · 모바일 하단바)</text>
  <text x="904" y="500" font-size="14" fill="#334155">AuthLayout · AccountLayout</text>
  <text x="904" y="552" font-size="13" fill="#92400e">여러 기능이 같이 쓰는 작은 부품</text>

  <!-- arrows between -->
  <line x1="360" y1="418" x2="418" y2="418" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="389" y="410" text-anchor="middle" font-size="11" fill="#64748b">가져다 씀</text>
  <line x1="820" y1="418" x2="878" y2="418" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="849" y="410" text-anchor="middle" font-size="11" fill="#64748b">공용 사용</text>

  <!-- life detail -->
  <line x1="620" y1="568" x2="620" y2="606" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="60" y="608" width="760" height="190" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="84" y="638" font-size="18" font-weight="700" fill="#0f172a">features/life/ 안쪽 모습 (큰 기능의 예)</text>

  <rect x="84" y="656" width="220" height="62" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="194" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">components/</text>
  <text x="194" y="702" text-anchor="middle" font-size="12" fill="#475569">화면 부품 + .module.css</text>

  <rect x="320" y="656" width="220" height="62" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="430" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">store.ts</text>
  <text x="430" y="702" text-anchor="middle" font-size="12" fill="#475569">저장 데이터 (zustand, 브라우저)</text>

  <rect x="556" y="656" width="244" height="62" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="678" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">types.ts</text>
  <text x="678" y="702" text-anchor="middle" font-size="12" fill="#475569">데이터 모양 정의</text>

  <rect x="84" y="728" width="220" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="194" y="752" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">derive.ts</text>
  <text x="194" y="772" text-anchor="middle" font-size="12" fill="#475569">계산 로직 (D-day, 합계)</text>

  <rect x="320" y="728" width="220" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="430" y="752" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">data/</text>
  <text x="430" y="772" text-anchor="middle" font-size="12" fill="#475569">예시 데이터</text>

  <rect x="556" y="728" width="244" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="678" y="752" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">index.ts</text>
  <text x="678" y="772" text-anchor="middle" font-size="12" fill="#475569">밖에 내보낼 것만 (출입구)</text>

  <!-- misc -->
  <rect x="880" y="608" width="260" height="190" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="904" y="638" font-size="18" font-weight="700" fill="#0f172a">그 밖의 폴더</text>
  <text x="904" y="670" font-size="14" fill="#334155">lib/     공용 도구 함수</text>
  <text x="904" y="692" font-size="12" fill="#64748b">         (서버 요청 · 저장소 · 날짜)</text>
  <text x="904" y="722" font-size="14" fill="#334155">styles/  전체 공통 스타일</text>
  <text x="904" y="752" font-size="14" fill="#334155">assets/  이미지 등</text>

  <!-- how to -->
  <rect x="60" y="830" width="1080" height="130" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="84" y="860" font-size="17" font-weight="700" fill="#0f172a">새 기능을 만들 때 순서</text>
  <text x="84" y="890" font-size="14" fill="#334155">1. features/ 에 기능 폴더를 만들고 store · types · components 를 넣어요.</text>
  <text x="84" y="914" font-size="14" fill="#334155">2. pages/ 에 화면을 만들어 그 기능의 부품을 배치해요.</text>
  <text x="84" y="938" font-size="14" fill="#334155">3. app/router.tsx 에 주소를 등록하고, 로그인이 필요하면 ProtectedRoute 안에 넣어요.</text>

  <!-- outside src -->
  <rect x="60" y="980" width="1080" height="90" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="84" y="1008" font-size="17" font-weight="700" fill="#881337">src 밖: 백엔드와 맞출 약속 (frontend/API.md · backend/openapi.yaml)</text>
  <text x="84" y="1034" font-size="14" fill="#334155">API.md = 사람이 읽는 API 약속  ·  openapi.yaml = 같은 내용을 Swagger(OpenAPI 3.0.3)로 (주소 81 · API 115)</text>
  <text x="84" y="1056" font-size="14" fill="#334155">백엔드(backend/ 뼈대만 있음): Spring Boot 4.1.2 + Java 17 + Gradle + JPA + MySQL  ·  기능 코드는 아직 없음, 화면은 브라우저에 저장</text>
</svg>
