openapi: 3.0.3
info:
  title: ZIP 자취생 생활 도우미 API
  version: 0.1.0
  description: |
    프론트(React)와 백엔드(Spring Boot)가 주고받을 API 약속이에요. 사람이 읽는 설명은 `frontend/API.md`, DB 기준은 `db/schema.sql`이에요.
    Swagger(Studio · UI)에서 이 파일을 열어 경로와 스키마를 검토할 수 있어요.

    **공통 규칙**
    - 주소는 모두 `/api`로 시작. 로그인 후 요청에는 `Authorization: Bearer <accessToken>`
    - JSON 키는 camelCase, id 는 **문자열**(`"12"`), 날짜 `2026-10-24` · 시각 `18:00` · 연월 `2026-10` · 일시 ISO 8601
    - 금액은 **원 단위 정수**. 단 하나, 설정의 월세(`rent`)만 **만원 단위**
    - 실패는 `{ "message": "…" }` (화면에 그대로 보여요, 일부는 `code` 도 함께). 401 = 토큰 없음/만료, 403 = 권한 없음(정지 · 관리자 전용 · 동네 미인증)
    - 처리하지 못한 오류도 같은 모양: 409 = 중복 · 제약 위반(같은 요청을 두 번 보낸 경우 등), 500 = 예상하지 못한 서버 오류. 응답에 SQL · 스택 같은 내부 내용은 넣지 않고 서버 로그에만 남겨요. 없는 주소 404 · 지원하지 않는 메서드 405 · 값 형식 오류 400 도 `{ message }`
    - 늘어나는 목록은 `?page=0&size=20` → `{ items: [...], hasNext }`
    - 개인 데이터는 토큰 사용자 것만. 남의 id 로 요청하면 404
servers:
  - url: http://localhost:8080
    description: 로컬 백엔드 (프론트 개발 서버는 /api 를 여기로 넘김)
security:
  - bearerAuth: []
tags:
  - name: 인증 · 내 정보
  - name: 설정 · 동네
  - name: 일정 · 쓰레기 배출
  - name: 월세 · 고정 지출
  - name: 가계부
  - name: 알림
  - name: 커뮤니티 · 첨부 · 신고
  - name: AI
  - name: 지도
  - name: 약관
  - name: 관리자 · 이용 정지
  - name: 메모
  - name: 고객센터

paths:
  # ───────────────────────── 1. 인증 · 내 정보 ─────────────────────────
  /api/auth/signup:
    post:
      tags: [인증 · 내 정보]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 아이디 · 이메일 중복, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/login:
    post:
      tags: [인증 · 내 정보]
      summary: 로그인 (아이디 또는 이메일)
      description: 성공하면 `users.last_login_at` 갱신. 처음 로그인이면 `user.firstLogin = true` → 프론트가 설문(/onboarding)으로 보냄
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string, example: zipdemo }
                password: { type: string, format: password, example: zip12345 }
                remember: { type: boolean, description: 로그인 유지 }
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: 이용 정지된 계정, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/logout:
    post:
      tags: [인증 · 내 정보]
      summary: 로그아웃 (세션 만료 처리)
      responses:
        '204': { description: 완료 }
  /api/auth/refresh:
    post:
      tags: [인증 · 내 정보]
      summary: 액세스 토큰 자동 재발급
      description: 재발급 쿠키를 교체하며 최초 세션 만료 시각은 유지합니다.
      security: []
      parameters:
        - in: header
          name: X-Zip-Session
          required: true
          description: 기존 액세스 토큰의 sid
          schema: { type: string, pattern: '^[0-9]+$' }
        - in: cookie
          name: zip_refresh
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 새 토큰
          headers:
            Set-Cookie:
              description: 갱신된 HttpOnly 재발급 쿠키
              schema: { type: string }
          content: { application/json: { schema: { type: object, required: [accessToken], properties: { accessToken: { type: string } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 이용 정지된 계정, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/me:
    get:
      tags: [인증 · 내 정보]
      summary: 내 정보
      responses:
        '200': { description: 내 정보, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [인증 · 내 정보]
      summary: 내 정보 수정 (닉네임 · 프로필 꾸미기 · 소셜 첫 가입 동의)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200': { description: 바뀐 내 정보, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [인증 · 내 정보]
      summary: 회원 탈퇴 (개인 데이터 CASCADE 삭제, withdrawal_logs 기록)
      responses:
        '204': { description: 탈퇴 완료 }
  /api/auth/me/password:
    patch:
      tags: [인증 · 내 정보]
      summary: 비밀번호 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8, maxLength: 16 }
      responses:
        '204': { description: 변경 완료 }
        '400': { description: 현재 비밀번호가 틀림, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/email/send:
    post:
      tags: [인증 · 내 정보]
      summary: 이메일 인증번호 보내기 (3분 유효)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, purpose]
              properties:
                email: { type: string, format: email, example: you@example.com }
                purpose: { $ref: '#/components/schemas/EmailPurpose' }
      responses:
        '204': { description: 메일 발송 }
        '429':
          description: "보내기 제한 — code: EMAIL_TOO_FAST(같은 주소 1분 1통) · EMAIL_TOO_MANY(같은 주소 1시간 10통) · EMAIL_IP_LIMIT(같은 IP 10분 5통 · 하루 20통) · EMAIL_BUSY(서버 전체 시간당 100통 · 하루 400통). 숫자는 서버 설정으로 바뀔 수 있음"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /api/auth/email/verify:
    post:
      tags: [인증 · 내 정보]
      summary: 인증번호 확인 → 한 번만 쓰는 verificationToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, purpose]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\d{6}$', example: '123456' }
                purpose: { $ref: '#/components/schemas/EmailPurpose' }
      responses:
        '200':
          description: 확인 완료
          content: { application/json: { schema: { type: object, properties: { verificationToken: { type: string } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/auth/find-id:
    post:
      tags: [인증 · 내 정보]
      summary: 아이디 찾기
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, email, emailVerificationToken]
              properties:
                nickname: { type: string }
                email: { type: string, format: email }
                emailVerificationToken: { type: string }
      responses:
        '200':
          description: 찾은 아이디
          content: { application/json: { schema: { type: object, properties: { username: { type: string } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/auth/password-reset/verify:
    post:
      tags: [인증 · 내 정보]
      summary: 비밀번호 찾기 — 본인 확인 → resetToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, emailVerificationToken]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                emailVerificationToken: { type: string }
      responses:
        '200':
          description: 확인 완료
          content: { application/json: { schema: { type: object, properties: { resetToken: { type: string } } } } }
  /api/auth/password-reset:
    post:
      tags: [인증 · 내 정보]
      summary: 새 비밀번호 저장
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword]
              properties:
                resetToken: { type: string }
                newPassword: { type: string, format: password }
      responses:
        '204': { description: 저장 완료 }
  /api/oauth2/authorization/{provider}:
    get:
      tags: [인증 · 내 정보]
      summary: 소셜 로그인 시작 (페이지 이동)
      description: 성공 시 프론트 `/oauth/callback#token=<accessToken>`으로, 실패 시 `/oauth/callback?error=<문구>`로 돌아가요.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [kakao, google, naver] } }
      responses:
        '302': { description: 소셜 로그인 화면으로 이동 }
  /api/me/profile-info:
    get:
      tags: [인증 · 내 정보]
      summary: 내 정보 화면의 아이디 · 이메일 · 이름 · 생년월일
      responses:
        '200': { description: 내 정보, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInfo' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [인증 · 내 정보]
      summary: 이름 · 생년월일 수정 (본문은 정확히 nickname · birth 두 개)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, birth]
              additionalProperties: false
              properties:
                nickname: { type: string, minLength: 2, maxLength: 12 }
                birth: { type: string, format: date }
      responses:
        '200': { description: 고친 내 정보, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInfo' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/me/sanctions:
    get:
      tags: [인증 · 내 정보]
      summary: 내가 받은 경고 · 정지 내역 (처리한 운영자 · 해제 사유는 빼고)
      responses:
        '200':
          description: 경고 · 정지
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    type: { type: string, enum: [WARNING, SUSPEND, BAN] }
                    days: { type: integer, format: int64, nullable: true, description: '정지 일수 (경고 · 영구 정지는 null)' }
                    reason: { type: string }
                    at: { type: string, format: date-time }
                    revoked: { type: boolean }
  /api/me/warnings/seen:
    post:
      tags: [인증 · 내 정보]
      summary: 경고 창 "확인했어요" (user_sanctions.seen_at)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdList' }
      responses:
        '204': { description: 기록 완료 }

  # ───────────────────────── 2. 설정 · 동네 ─────────────────────────
  /api/me/settings:
    get:
      tags: [설정 · 동네]
      summary: 생활 설정 (동네 · 월세 · 계약 · 알림 · 집 주소)
      responses:
        '200': { description: 설정, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
    put:
      tags: [설정 · 동네]
      summary: 생활 설정 저장 (동네를 바꾸면 동네 인증이 풀림)
      description: rent/rentDay/moveIn/contractEnd/notiOn은 필수. 선택 주소·동네 필드는 생략하면 유지. regionLocation의 null만 보내면 동네 선택 해제. ID나 이름도 명시하면 해당 동네를 manual 출처로 선택. 설정 저장으로 새 동네 인증을 부여하지 않음.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200': { description: 저장된 설정, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
  /api/me/home-info:
    get:
      tags: [설정 · 동네]
      summary: 내 집 설정·계약·대출 및 이자 기록 조회
      responses:
        '200': { $ref: '#/components/responses/HomeInfo' }
    put:
      tags: [설정 · 동네]
      summary: 내 집 계약 및 대출 조건 저장
      description: 입력 금액은 원 단위이며 응답 settings.rent는 만원 단위입니다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HomeInfoInput' } } }
      responses:
        '200': { $ref: '#/components/responses/HomeInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/me/home-info/loan:
    put:
      tags: [설정 · 동네]
      summary: 전세 대출 조건 변경 또는 자동 기록 중지
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [loan]
              properties:
                loan: { $ref: '#/components/schemas/HousingLoanInput' }
      responses:
        '200': { $ref: '#/components/responses/HomeInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/me/housing-onboarding:
    put:
      tags: [설정 · 동네]
      summary: 첫 주거 설문 저장 또는 건너뛰기
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HousingOnboardingInput' } } }
      responses:
        '200': { description: 설문 상태가 반영된 회원 정보, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/regions:
    get:
      tags: [설정 · 동네]
      summary: 동네(행정구역) 목록
      security: []
      responses:
        '200':
          description: 동네 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string, example: 마포구 }
                    parentId: { type: string, nullable: true }
                    level: { type: integer }
  /api/regions/{id}/neighbors:
    get:
      tags: [설정 · 동네]
      summary: 주변 동네 (커뮤니티 '주변 동네')
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: 주변 동네, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RegionRef' } } } } }
  /api/me/region-verify:
    post:
      tags: [설정 · 동네]
      summary: 동네 인증 (지금 GPS 좌표의 동네로, 30일 유지)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat: { type: number, example: 37.5566 }
                lon: { type: number, example: 126.9236 }
      responses:
        '200':
          description: 인증 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  region: { $ref: '#/components/schemas/RegionRef' }
                  verifiedAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }

  # ───────────────────────── 3. 일정 · 쓰레기 배출 ─────────────────────────
  /api/events:
    get:
      tags: [일정 · 쓰레기 배출]
      summary: 기간 안의 일정 (달력 · 그날 일정 창)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date }, example: '2026-10-01' }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, example: '2026-10-31' }
      responses:
        '200': { description: 일정 목록, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } } }
    post:
      tags: [일정 · 쓰레기 배출]
      summary: 일정 추가 (기념일은 anniv, 매년 반복은 yearly)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200': { description: 추가된 일정, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
  /api/events/search:
    get:
      tags: [일정 · 쓰레기 배출]
      summary: 일정 검색
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, example: 월세 }
      responses:
        '200': { description: 찾은 일정, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } } }
  /api/events/{id}:
    patch:
      tags: [일정 · 쓰레기 배출]
      summary: 일정 수정 (바꿀 칸만)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200': { description: 바뀐 일정, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [일정 · 쓰레기 배출]
      summary: 일정 삭제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: 삭제 완료 }
  /api/events/{id}/done:
    patch:
      tags: [일정 · 쓰레기 배출]
      summary: 할 일 완료 체크
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [done], properties: { done: { type: boolean } } }
      responses:
        '200': { description: 바뀐 일정, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
  /api/trash-schedules:
    get:
      tags: [일정 · 쓰레기 배출]
      summary: 동네(시군구)의 쓰레기 배출표 — 배출장소마다 생활쓰레기 · 음식물 · 재활용 배출 요일과 시작 시각 (전국생활쓰레기배출정보표준데이터)
      parameters:
        - { name: regionId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 배출표 (배출 없는 종류는 null, 없는 동네는 빈 배열)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrashSchedule' }
  /api/trash-schedules/me:
    get:
      tags: [일정 · 쓰레기 배출]
      summary: 로그인 회원의 내 집 주소로 배출표 조회. 내 집 주소가 비어 있으면 회원 주소 사용
      responses:
        '200':
          description: 시·군·구를 찾지 못하면 regionName은 null, 배출표가 없으면 items는 빈 배열
          content:
            application/json:
              schema:
                type: object
                required: [regionName, items]
                properties:
                  regionName: { type: string, nullable: true, example: '서울특별시 마포구' }
                  items: { type: array, items: { $ref: '#/components/schemas/TrashSchedule' } }
  /api/event-categories:
    get:
      tags: [일정 · 쓰레기 배출]
      summary: 일정 카테고리 (기본 5개 + 내가 만든 것 + 미분류)
      responses:
        '200': { description: 카테고리, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventCategory' } } } } }
    post:
      tags: [일정 · 쓰레기 배출]
      summary: 카테고리 추가
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NameInput' } } }
      responses:
        '200': { description: 추가된 카테고리, content: { application/json: { schema: { $ref: '#/components/schemas/EventCategory' } } } }
  /api/event-categories/{id}:
    patch:
      tags: [일정 · 쓰레기 배출]
      summary: 카테고리 이름 변경 (그 카테고리의 일정 · 항목도 같이)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NameInput' } } }
      responses:
        '204': { description: 변경 완료 }
    delete:
      tags: [일정 · 쓰레기 배출]
      summary: 카테고리 삭제 (그 카테고리의 일정 · 항목은 미분류로)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: 삭제 완료 }
  /api/event-presets:
    get:
      tags: [일정 · 쓰레기 배출]
      summary: 내가 만든 항목 버튼
      responses:
        '200': { description: 항목 버튼, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventPreset' } } } } }
    post:
      tags: [일정 · 쓰레기 배출]
      summary: 항목 버튼 추가
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventPresetInput' } } }
      responses:
        '200': { description: 추가된 항목, content: { application/json: { schema: { $ref: '#/components/schemas/EventPreset' } } } }
  /api/event-presets/{id}:
    patch:
      tags: [일정 · 쓰레기 배출]
      summary: 항목 버튼 수정
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventPresetInput' } } }
      responses:
        '204': { description: 수정 완료 }
    delete:
      tags: [일정 · 쓰레기 배출]
      summary: 항목 버튼 삭제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: 삭제 완료 }

  # ───────────────────────── 4. 월세 · 고정 지출 ─────────────────────────
  /api/bills:
    get:
      tags: [월세 · 고정 지출]
      summary: 고정 지출 항목 + 그 달 납부 상태
      description: 조회는 DB를 변경하지 않음. 과거 월은 기존 스냅샷만 반환. 당월·미래 월의 활성 항목에 기록이 없으면 기본 금액의 예정액(snapshot=false) 반환. 해지 항목도 해당 월 기록이 있으면 active=false로 반환.
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, example: '2026-10' }
      responses:
        '200': { description: 고정 지출, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Bill' } } } } }
    post:
      tags: [월세 · 고정 지출]
      summary: 고정 지출 항목 추가
      description: 한국 기준 당월 미납 스냅샷을 함께 생성. 같은 이름·분류의 활성 항목이 있으면 409. 모든 금액은 0~9007199254740991원 정수.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, amount, tag]
              properties:
                name: { type: string, maxLength: 30, example: 전기 }
                amount: { type: integer, minimum: 0, example: 32000 }
                tag: { type: string, maxLength: 24, example: 공과금, description: '기본 공과금 · 통신 · 구독 · 관리비 · 기타 + 회원이 만든 분류' }
      responses:
        '200': { description: 추가된 항목, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }
  /api/bills/{id}/payments/{month}:
    put:
      tags: [월세 · 고정 지출]
      summary: 그 달 납부 체크 · 금액 수정 (줄이 없으면 서버가 만듦)
      description: paid/amount 중 하나 이상 필요. 미래 월 저장은 400. 기록이 없는 과거 월은 amount 필수. 반복 paid=true는 최초 paidAt 유지. amount만 수정하면 납부 상태 유지. 해지 항목은 기존 월 기록만 수정 가능.
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paid: { type: boolean }
                amount: { type: integer, minimum: 0 }
      responses:
        '200': { description: 바뀐 항목, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }
  /api/bills/{id}:
    patch:
      tags: [월세 · 고정 지출]
      summary: 고정 지출 항목 수정 — 바꿀 값만
      description: default_amount에 반영하며 당월 기존 금액은 먼저 확정해 보존. 기존 월별 스냅샷은 덮어쓰지 않음. 당월 금액 정정은 payments API 사용. 같은 이름·분류 중복은 409. 해지 항목은 404.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 30 }
                amount: { type: integer, minimum: 0 }
                tag: { type: string, maxLength: 24 }
      responses:
        '200': { description: 바뀐 항목, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [월세 · 고정 지출]
      summary: 고정 지출 해지 (is_active = 0)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: 해지 완료 }

  /api/bills/monthly:
    parameters:
      - $ref: '#/components/parameters/QueryMonth'
      - $ref: '#/components/parameters/TimeZone'
    get:
      tags: [월세 · 고정 지출]
      summary: 선택 월의 고정 지출 및 계약 비용 조회
      responses:
        '200': { description: 월별 고정 지출, content: { application/json: { schema: { $ref: '#/components/schemas/MonthlyBills' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [월세 · 고정 지출]
      summary: 해당 월의 청구 등록
      description: 이름을 생략하면 분류명을 사용합니다. 미래 월과 이미 지난 새 납부 기한에는 등록할 수 없습니다.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MonthlyBillCreate' } } }
      responses:
        '200': { description: 등록된 월별 청구, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/bills/monthly/auto-register:
    post:
      tags: [월세 · 고정 지출]
      summary: 월세·별도 관리비·전세 이자 자동 등록
      parameters:
        - $ref: '#/components/parameters/TimeZone'
        - { name: month, in: query, schema: { $ref: '#/components/schemas/Month' }, description: 생략하면 현재 월 }
      responses:
        '204': { description: 자동 등록 처리 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/bills/monthly/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - $ref: '#/components/parameters/QueryMonth'
      - $ref: '#/components/parameters/TimeZone'
    patch:
      tags: [월세 · 고정 지출]
      summary: 등록된 월별 청구 수정
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MonthlyBillUpdate' } } }
      responses:
        '200': { description: 수정된 월별 청구, content: { application/json: { schema: { $ref: '#/components/schemas/Bill' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [월세 · 고정 지출]
      summary: 선택 월의 미납 청구 삭제
      responses:
        '204': { description: 삭제 처리 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/bills/monthly/{id}/payment:
    put:
      tags: [월세 · 고정 지출]
      summary: 월별 청구 납부 상태 변경
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: '월별 조회 응답의 숫자 항목 ID, rent:YYYY-MM 또는 interest:{loanId}:YYYY-MM'
        - $ref: '#/components/parameters/QueryMonth'
        - $ref: '#/components/parameters/TimeZone'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paid]
              properties:
                paid: { type: boolean }
      responses:
        '204': { description: 납부 상태 변경 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/bills/monthly/{id}/termination:
    post:
      tags: [월세 · 고정 지출]
      summary: 일반 고정 지출 해지 적용일 지정
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/TimeZone'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [effectiveDate]
              properties:
                effectiveDate: { type: string, format: date, description: 요청 시간대의 오늘 이후 }
      responses:
        '204': { description: 해지 적용일 설정 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── 5. 가계부 ─────────────────────────
  /api/ledger/income:
    get:
      tags: [가계부]
      summary: 월별 수입 조회
      parameters:
        - $ref: '#/components/parameters/QueryMonth'
        - $ref: '#/components/parameters/TimeZone'
        - { name: incomeType, in: query, schema: { type: string, enum: [fixed, other], default: fixed } }
      responses:
        '200': { $ref: '#/components/responses/LedgerRows' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [가계부]
      summary: 수입 등록
      parameters: [{ $ref: '#/components/parameters/TimeZone' }]
      requestBody: { $ref: '#/components/requestBodies/LedgerIncome' }
      responses:
        '201': { description: 등록 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/ledger/income/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    put:
      tags: [가계부]
      summary: 수입 수정
      parameters: [{ $ref: '#/components/parameters/TimeZone' }]
      requestBody: { $ref: '#/components/requestBodies/LedgerIncome' }
      responses:
        '204': { description: 수정 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [가계부]
      summary: 수입 삭제
      responses:
        '204': { description: 삭제 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/ledger/spend:
    get:
      tags: [가계부]
      summary: 월별 기타 지출 조회
      parameters:
        - $ref: '#/components/parameters/QueryMonth'
        - $ref: '#/components/parameters/TimeZone'
      responses:
        '200': { $ref: '#/components/responses/LedgerRows' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [가계부]
      summary: 기타 지출 등록
      parameters: [{ $ref: '#/components/parameters/TimeZone' }]
      requestBody: { $ref: '#/components/requestBodies/LedgerSpend' }
      responses:
        '201': { description: 등록 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/ledger/spend/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    put:
      tags: [가계부]
      summary: 기타 지출 수정
      parameters: [{ $ref: '#/components/parameters/TimeZone' }]
      requestBody: { $ref: '#/components/requestBodies/LedgerSpend' }
      responses:
        '204': { description: 수정 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [가계부]
      summary: 기타 지출 삭제
      responses:
        '204': { description: 삭제 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/ledger/income-summary:
    get:
      tags: [가계부]
      summary: 현재 월을 포함한 최근 12개월의 수입 합계
      parameters: [{ $ref: '#/components/parameters/TimeZone' }]
      responses:
        '200':
          description: 수입이 있는 월만 포함한 연월별 합계
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, format: int64 }
              example: { '2026-10': 1250000, '2026-11': 1600000 }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/me/ledger-categories:
    parameters:
      - { name: scope, in: query, required: true, schema: { $ref: '#/components/schemas/LedgerScope' } }
    get:
      tags: [가계부]
      summary: 회원별 분류 설정 조회
      responses:
        '200': { description: 분류 설정, content: { application/json: { schema: { $ref: '#/components/schemas/MyLedgerCategories' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [가계부]
      summary: 회원별 분류 순서·이름 변경, 추가·삭제 또는 기존 브라우저 설정 가져오기
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LedgerCategoryChange' } } }
      responses:
        '200': { description: 저장된 분류 설정, content: { application/json: { schema: { $ref: '#/components/schemas/MyLedgerCategories' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/me/salary:
    get:
      tags: [가계부]
      summary: 자동 등록 월급 설정 조회
      responses:
        '200': { description: 월급 설정, content: { application/json: { schema: { $ref: '#/components/schemas/SalarySettings' } } } }
    put:
      tags: [가계부]
      summary: 자동 등록 월급 설정 저장
      parameters: [{ $ref: '#/components/parameters/TimeZone' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SalaryInput' } } }
      responses:
        '200': { description: 저장된 월급 설정, content: { application/json: { schema: { $ref: '#/components/schemas/SalarySettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ───────────────────────── 6. 알림 ─────────────────────────
  /api/notifications:
    get:
      tags: [알림]
      summary: 알림 목록 + 안 읽은 수
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [all, unread, read], default: all } }
      responses:
        '200':
          description: 알림
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unreadCount: { type: integer }
    delete:
      tags: [알림]
      summary: 읽은 알림 지우기
      parameters:
        - name: ids
          in: query
          required: true
          description: '지울 알림 id (쉼표로 구분, 예: ids=1,2)'
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
      responses:
        '204': { description: 삭제 완료 }
  /api/notifications/read:
    patch:
      tags: [알림]
      summary: 읽음 처리 (ids 가 빈 배열이면 전부)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IdList' } } }
      responses:
        '204': { description: 읽음 완료 }

  # ───────────────────────── 7. 커뮤니티 · 첨부 · 신고 ─────────────────────────
  /api/posts:
    get:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 동네생활 글 목록 (로그인 회원, 읽기에는 동네 인증이 필요 없음 — 인증은 글쓰기 · 댓글 · 공감만)
      parameters:
        - { name: scope, in: query, description: '생략하거나 비우면 all. here = 내 동네, near = 내 동네 + 이웃 동네', schema: { type: string, enum: [here, near, all], default: all } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/PostCategory' } }
        - { name: q, in: query, description: '앞뒤 공백을 뺀 뒤 40자까지. 공백으로 나눈 각 단어가 제목이나 본문에 포함되어야 합니다. 이 중 한글 음절만 3자 이상인 단어는 제목과 본문의 일반 공백을 각각 제거한 뒤 비교합니다.', schema: { type: string } }
        - name: sort
          in: query
          description: '생략 시 검색어가 있으면 relevance, 없으면 latest. views는 누적 조회수, popular는 공감 수 + 2 × 댓글 수로 정렬합니다. 여러 단어의 relevance는 원문의 연속 구문 일치와 제목·본문 양쪽의 단어 일치를 순서대로 비교합니다. 검색어 전체가 한글 음절만 3자 이상인 한 단어면 일반 공백을 제거해 양쪽 일치를 비교하며 동점에서 제목 일치를 우선합니다. 최종 동점은 작성 시각과 ID 내림차순입니다.'
          schema: { type: string, enum: [latest, views, popular, relevance] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { description: 글 목록, content: { application/json: { schema: { $ref: '#/components/schemas/PostPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 글쓰기 (동네 인증 · 정지 아님 필요)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PostInput' } } }
      responses:
        '200': { description: 쓴 글, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/posts/my-count:
    get:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 로그인한 회원의 전체 공개 게시글 수
      responses:
        '200':
          description: 공개 게시글 수
          content: { application/json: { schema: { type: object, required: [count], properties: { count: { type: integer, format: int64, minimum: 0 } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/posts/neighbors:
    get:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: '"주변 동네" 탭 안내 — 내 동네와 이웃 동네 (글 목록 scope=near 와 같은 기준)'
      responses:
        '200':
          description: 내 동네(인증 전이면 null)와 이웃 동네
          content:
            application/json:
              schema:
                type: object
                properties:
                  region: { allOf: [{ $ref: '#/components/schemas/RegionBrief' }], nullable: true }
                  neighbors: { type: array, items: { $ref: '#/components/schemas/RegionBrief' } }
  /api/posts/popular:
    get:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 내 동네 공개 게시글 조회 수 순위 (최대 3개)
      responses:
        '200': { description: 조회 수 상위 게시글, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Post' } } } } }
  /api/posts/{id}/views:
    post:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 공개 게시글 조회 수 증가
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: 집계 완료 }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/posts/home-tips:
    get:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 기존 관리자 지정 글 목록 (is_home_tip)
      responses:
        '200': { description: 꿀팁 글, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Post' } } } } }
  /api/posts/{id}:
    get:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 글 상세 (댓글 포함)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 글, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 글 수정 (내 글만)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PostInput' } } }
      responses:
        '200': { description: 바뀐 글, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 글 삭제 (내 글만, status = DELETED)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: 삭제 완료 }
  /api/posts/{id}/like:
    put:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 공감
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Like' }
    delete:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 공감 취소
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Like' }
  /api/posts/{id}/comments:
    post:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 댓글 쓰기
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BodyInput' } } }
      responses:
        '200': { description: 쓴 댓글, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/comments/{id}:
    patch:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 댓글 수정 (내 댓글만)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BodyInput' } } }
      responses:
        '200': { description: 바뀐 댓글, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
    delete:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 댓글 삭제 (내 댓글만)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: 삭제 완료 }
  /api/files:
    post:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 파일 올리기 — 현재 프로필 JPEG/PNG 1개·2MB 이하 지원
      description: 현재 구현은 프로필 사진 업로드만 지원. 실제 이미지 형식·픽셀 크기를 검사하고 메타데이터를 제거해 저장. 커뮤니티 문서 및 여러 첨부 합계 검증은 후속 구현.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 올린 파일, content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } } }
        '413': { description: 용량 초과, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "회원당 업로드 제한 — code: UPLOAD_DAILY_LIMIT(24시간 50장, 지운 사진 포함) · UPLOAD_PENDING_LIMIT(아직 글 · 프로필 · 리뷰에 안 붙인 사진 20장). 숫자는 서버 설정으로 바뀔 수 있음", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/files/{id}/unused:
    delete:
      tags: [인증 · 내 정보]
      summary: 올렸지만 프로필에 쓰지 않은 내 사진 지우기 (프로필 저장 취소 때)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: 삭제 완료 }
  /api/files/content/{key}:
    get:
      tags: [인증 · 내 정보]
      summary: 프로필 사진 조회
      description: 프로필에 연결된 사진은 공개 조회. 연결 전 업로드는 유효한 업로더 토큰으로만 조회. 삭제되거나 연결 해제된 사진은 익명 요청에 404.
      security: []
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 사진 픽셀
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/reports:
    post:
      tags: [커뮤니티 · 첨부 · 신고]
      summary: 글 · 댓글 신고 (같은 대상 두 번이면 409)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              properties:
                targetType: { type: string, enum: [POST, COMMENT] }
                targetId: { type: string }
                reason: { $ref: '#/components/schemas/ReportReason' }
                detail: { type: string, maxLength: 200, description: '기타(OTHER)는 필수' }
      responses:
        '204': { description: 접수 완료 }
        '409': { description: 이미 신고함, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ───────────────────────── 8. AI ─────────────────────────
  /api/ai/conversations:
    get:
      tags: [AI]
      summary: 대화 목록
      parameters:
        - { name: entryPoint, in: query, schema: { type: string, enum: [HOME_MODAL, AI_PAGE] } }
      responses:
        '200':
          description: 대화
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    topic: { type: string }
                    updatedAt: { type: string, format: date-time }
    post:
      tags: [AI]
      summary: 새 대화
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entryPoint: { type: string, enum: [HOME_MODAL, AI_PAGE] }
                topic: { type: string }
      responses:
        '200': { description: 만든 대화, content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
    delete:
      tags: [AI]
      summary: 내 AI 대화 전부 지우기 (설정의 "데이터 초기화")
      responses:
        '204': { description: 삭제 완료 }
  /api/ai/conversations/{id}:
    delete:
      tags: [AI]
      summary: 대화 삭제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: 삭제 완료 }
  /api/ai/conversations/{id}/messages:
    get:
      tags: [AI]
      summary: 대화 내용
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 메시지, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AiMessage' } } } } }
    post:
      tags: [AI]
      summary: 질문 보내기 (사진은 답을 만든 뒤 저장하지 않음, 하루 한도 넘으면 429)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string } } }
          multipart/form-data:
            schema:
              type: object
              properties:
                text: { type: string }
                photo: { type: string, format: binary }
      responses:
        '200':
          description: 내 질문 + 답
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/AiMessage' }
                  reply: { $ref: '#/components/schemas/AiMessage' }
        '429': { description: 하루 질문 한도 초과, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/ai/conversations/{id}/exchanges:
    post:
      tags: [AI]
      summary: 화면이 만든 질문 · 답을 대화에 저장 (AI 호출 없이 · 카드 포함 가능)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, reply]
              properties:
                text: { type: string, maxLength: 2000 }
                reply: { type: string, maxLength: 4000 }
                card:
                  type: object
                  required: [type, data]
                  properties:
                    type: { type: string, maxLength: 20, enum: [SPEND_SUMMARY, LINK] }
                    data: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 저장한 질문 + 답
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/AiMessage' }
                  reply: { $ref: '#/components/schemas/AiMessage' }
  /api/ai/conversations/{conversationId}/bill-photo:
    post:
      tags: [AI]
      summary: 고지서 사진 인식 (공과금 · 생활비 대화만, 바로 등록하지 않고 확인 대기)
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [month, timeZone, photo]
              properties:
                month: { type: string, example: '2026-11' }
                timeZone: { type: string, example: Asia/Seoul }
                question: { type: string, default: 고지서의 금액과 납부 기한을 읽어 주세요. }
                photo: { type: string, format: binary }
      responses:
        '200':
          description: 인식 결과 (draftId 로 등록 여부 결정)
          content:
            application/json:
              schema:
                type: object
                properties:
                  draftId: { type: string }
                  preview:
                    type: object
                    properties:
                      name: { type: string }
                      tag: { type: string }
                      amount: { type: integer, format: int64 }
                      dueDate: { type: string, format: date }
                  reply: { $ref: '#/components/schemas/AiMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 공과금 · 생활비 대화가 아님, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 이미 등록한 사진, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 금액 · 납부 기한을 읽지 못함, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: '하루 AI 한도 초과 (code AI_LIMIT)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: AI 인식 실패, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'AI 설정 없음 (code AI_DISABLED)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/ai/conversations/{conversationId}/bill-photo/{draftId}/decision:
    post:
      tags: [AI]
      summary: 인식 결과 등록 / 취소
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: draftId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [register], properties: { register: { type: boolean } } } } }
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered: { type: boolean }
                  reply: { $ref: '#/components/schemas/AiMessage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 이미 처리한 인식 결과, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: 인식 결과 만료, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ───────────────────────── 9. 지도 ─────────────────────────
  /api/places/categories:
    get:
      tags: [지도]
      summary: 장소 종류 15개 + 검색 결과용 '기타' (칩에는 안 보임)
      responses:
        '200':
          description: 종류
          content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string, example: 세탁방 }, icon: { type: string, example: '🧺' } } } } } }
  /api/places:
    get:
      tags: [지도]
      summary: 동네 장소 (종류 또는 검색어, 가까운 순)
      description: 'category 또는 q 가 있고 서버에 카카오 키(KAKAO_REST_KEY)가 있으면 지도 중심(lat · lon, 없으면 우리 집) 근처를 카카오 로컬 API 에서 찾아 DB 에 저장하지 않고 그대로 돌려줘요(id 는 "kakao:카카오장소id", 같은 검색 10분 캐시). 한도 초과 · 키 없음 · 카카오 실패면 DB 에 있는 장소를 주고, 카카오를 못 쓴 이유를 응답 헤더 X-Place-Notice(user-limit · daily-limit · error)로 알려요. category · q 가 둘 다 없으면 DB 의 동네 장소 전체'
      parameters:
        - { name: regionId, in: query, required: true, schema: { type: string } }
        - { name: category, in: query, schema: { type: string }, example: 세탁방 }
        - { name: q, in: query, schema: { type: string, maxLength: 40 }, description: 직접 추가한 검색어 칩 }
        - { name: filter, in: query, schema: { type: string, enum: [24h, cheap, quiet] } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 }, description: '지도 중심 위도 (lon 과 함께)', example: 37.5496 }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 }, description: '지도 중심 경도 (lat 과 함께)', example: 126.9137 }
        - { name: wide, in: query, schema: { type: boolean, default: false }, description: '검색창 검색 (q 와 함께): 반경 5km + 거리 제한 없는 정확도 검색을 합쳐 이름이 같은 곳 → 이름에 든 곳 → 나머지 순. false(칩)면 반경 1km 가까운 순' }
      responses:
        '200': { description: 장소, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Place' } } } } }
  /api/places/nearby:
    post:
      tags: [지도]
      summary: 지정한 위치 반경 1km의 카카오맵 장소 최대 15곳
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q, lat, lon]
              properties:
                q: { type: string, minLength: 1, maxLength: 40, example: 약국 }
                lat: { type: number, minimum: -90, maximum: 90 }
                lon: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: 지정한 위치에서 직선 거리가 가까운 순
          content:
            application/json:
              schema:
                type: array
                maxItems: 15
                items:
                  type: object
                  required: [id, name, address, distanceMeters, lat, lon, category]
                  properties:
                    id: { type: string, description: 카카오맵 장소 ID }
                    name: { type: string }
                    address: { type: string, nullable: true }
                    distanceMeters: { type: integer }
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lon: { type: number, minimum: -180, maximum: 180 }
                    category: { type: string }
        '400': { description: 검색어 또는 좌표 오류 }
        '429': { description: 장소 검색 한도 초과 }
        '503': { description: 카카오맵 장소 검색 사용 불가 }
  /api/places/ai-search:
    post:
      tags: [지도]
      summary: AI 장소 찾기 (최대 5곳 + 추천 이유)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q, regionId]
              properties:
                q: { type: string, example: 밤에 갈 수 있는 약국 }
                regionId: { type: string }
      responses:
        '200':
          description: 추천 장소
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    place: { $ref: '#/components/schemas/Place' }
                    reasons: { type: array, items: { type: string }, example: ['약국', '24시간·심야 운영'] }
                    walkMin: { type: integer }
  /api/places/reviews/mine:
    get:
      tags: [지도]
      summary: 내가 쓴 장소 리뷰 (DB·카카오 장소 통합, 최신순)
      responses:
        '200':
          description: 로그인한 회원의 리뷰만 반환
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    placeId: { type: string, description: 'DB 장소 id 또는 kakao:장소id' }
                    placeName: { type: string }
                    rating: { type: integer }
                    body: { type: string }
                    createdAt: { type: string, format: date-time }
        '401':
          description: 로그인 필요

  /api/places/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [지도]
      summary: 장소 리뷰 목록 (DB 장소 · 카카오 장소 "kakao:…" 모두, 최신순)
      responses:
        '200':
          description: 리뷰
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    rating: { type: integer, minimum: 1, maximum: 5 }
                    body: { type: string }
                    photos:
                      type: array
                      items: { type: object, properties: { id: { type: string }, url: { type: string } } }
                    author:
                      type: object
                      properties:
                        id: { type: string }
                        nickname: { type: string }
                        avatarUrl: { type: string, nullable: true }
                        avatarEmoji: { type: string, nullable: true }
                        avatarColor: { type: string, nullable: true }
                        reviewCount: { type: integer, description: 이 사람이 쓴 후기 수 }
                        ratingAvg: { type: number, description: 이 사람의 별점 평균 }
                    createdAt: { type: string, format: date-time }
                    reportedByMe: { type: boolean, description: 내가 이미 신고한 리뷰 }
    post:
      tags: [지도]
      summary: 장소 리뷰 쓰기 (한 사람당 한 장소 하나, 두 번이면 409). 카카오 장소는 id · 이름과 리뷰만 kakao_place_reviews 에 저장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: string, maxLength: 300, description: DB place_reviews.body VARCHAR(300) }
                name: { type: string, maxLength: 60, description: 카카오 장소("kakao:…")만 필수 — 장소 이름 }
                photoIds: { type: array, maxItems: 5, items: { type: string }, description: 'POST /api/files 로 먼저 올린 내 사진 id (JPEG · PNG)' }
      responses:
        '204': { description: 저장 완료 }
        '400': { description: 별점 · 내용 · 카카오 장소 이름 확인, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 이미 리뷰를 씀, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/places/{id}/reviews/mine:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [지도]
      summary: 내 리뷰 고치기 (별점 · 내용 · 사진, 빠진 사진은 지움)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: string, maxLength: 300 }
                photoIds: { type: array, maxItems: 5, items: { type: string }, description: 'POST /api/files 로 먼저 올린 내 사진 id (JPEG · PNG)' }
      responses:
        '204': { description: 고침 }
        '400': { description: 별점 · 내용 확인, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 내 리뷰 없음, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [지도]
      summary: 내 리뷰 지우기
      responses:
        '204': { description: 지움 }
        '404': { description: 내 리뷰 없음, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/places/{id}/reviews/{reviewId}/reports:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: reviewId, in: path, required: true, schema: { type: string } }
    post:
      tags: [지도]
      summary: 리뷰 신고 (place_review_reports). 사유는 커뮤니티 신고와 같음
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [ABUSE, FALSE_INFO, PRIVACY, AD_ILLEGAL, COPYRIGHT, OTHER] }
                detail: { type: string, maxLength: 200, description: 기타(OTHER)는 필수 }
      responses:
        '204': { description: 신고 접수 }
        '400': { description: 사유 · 내용 확인, 내 리뷰, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 리뷰 없음, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 이미 신고함, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/places/review-summary:
    get:
      tags: [지도]
      summary: 지도 목록 별점 (ZIP 회원 리뷰 평균 · 수). 리뷰 없는 곳은 빠짐
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string }, description: '장소 id 쉼표 구분, 100곳까지 (예: 12,kakao:123)' }
      responses:
        '200':
          description: 별점 요약
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    rating: { type: number }
                    count: { type: integer }
  /api/me/place-favorites:
    get:
      tags: [지도]
      summary: 저장(★)한 장소 id
      description: DB 장소는 번호, 카카오 장소는 "kakao:카카오장소id"
      responses:
        '200': { description: 장소 id, content: { application/json: { schema: { type: array, items: { type: string } } } } }
  /api/me/place-favorites/kakao:
    get:
      tags: [지도]
      summary: 저장한 카카오 장소의 이름 · 종류 (저장 목록용, 주소 · 좌표 없음)
      responses:
        '200':
          description: 저장한 카카오 장소
          content:
            application/json:
              schema:
                type: array
                items: { type: object, properties: { id: { type: string }, name: { type: string }, category: { type: string } } }
  /api/me/place-favorites/{placeId}:
    parameters:
      - { name: placeId, in: path, required: true, schema: { type: string } }
    put:
      tags: [지도]
      summary: 저장(★)
      description: 카카오 장소("kakao:…")는 본문 { name, category } 가 필요해요. id · 이름 · 종류만 저장하고 주소 · 좌표는 저장하지 않아요 (한 사람당 200곳)
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string, maxLength: 60 }, category: { type: string } } }
      responses:
        '204': { description: 저장 완료 }
        '400': { description: '카카오 장소의 이름 · 종류가 없거나 잘못됨 · 200곳 초과' }
    delete:
      tags: [지도]
      summary: 저장 풀기
      responses:
        '204': { description: 해제 완료 }
  /api/me/place-favorites/{placeId}/lists:
    put:
      tags: [지도]
      summary: ★ 저장 창의 [저장] — 이 장소를 넣을 리스트 고르기 (비우면 저장 풂)
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listIds: { type: array, items: { type: string } }
                name: { type: string, description: 카카오 장소일 때 }
                category: { type: string, description: 카카오 장소일 때 }
      responses:
        '204': { description: 저장 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: 내 리스트가 아님, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/me/place-lists:
    get:
      tags: [지도]
      summary: 내 저장 리스트 (리스트마다 담긴 장소 id)
      responses:
        '200': { description: 리스트, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlaceList' } } } } }
    post:
      tags: [지도]
      summary: 리스트 만들기 (한 사람당 20개)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlaceListInput' } } }
      responses:
        '201': { description: 만든 리스트, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 같은 이름의 리스트, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/me/place-lists/{listId}:
    parameters:
      - { name: listId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [지도]
      summary: 리스트 이름 · 색 바꾸기
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlaceListInput' } } }
      responses:
        '204': { description: 수정 완료 }
        '409': { description: 같은 이름의 리스트, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [지도]
      summary: 리스트 지우기
      responses:
        '204': { description: 삭제 완료 }
  /api/me/map-settings:
    get:
      tags: [지도]
      summary: 칩에 보일 종류 · 직접 추가한 검색어
      responses:
        '200': { description: 지도 설정, content: { application/json: { schema: { $ref: '#/components/schemas/MapSettings' } } } }
    put:
      tags: [지도]
      summary: 지도 설정 저장
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MapSettings' } } }
      responses:
        '200': { description: 저장된 설정, content: { application/json: { schema: { $ref: '#/components/schemas/MapSettings' } } } }

  # ───────────────────────── 10. 약관 ─────────────────────────
  /api/terms:
    get:
      tags: [약관]
      summary: 지금 시행 중인 약관 (버전 2026-10-18)
      security: []
      responses:
        '200':
          description: 약관
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    docType: { type: string, enum: [SERVICE, PRIVACY, POLICY] }
                    version: { type: string, example: '2026-10-18' }
                    title: { type: string }
                    content: { type: string }
                    consentKind: { type: string }
                    required: { type: boolean }

  # ───────────────────────── 11. 관리자 · 이용 정지 ─────────────────────────
  /api/admin/stats:
    get:
      tags: [관리자 · 이용 정지]
      summary: 숫자 박스 (ADMIN 만, 아니면 403)
      responses:
        '200':
          description: 통계
          content:
            application/json:
              schema:
                type: object
                properties:
                  members: { type: integer }
                  suspended: { type: integer }
                  totalBans: { type: integer }
                  totalWarns: { type: integer }
                  pendingReports: { type: integer, description: 처리 대기 신고 대상 수 }
                  posts: { type: integer }
                  comments: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/members:
    get:
      tags: [관리자 · 이용 정지]
      summary: 회원 관리 목록
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED] } }
        - { name: minBans, in: query, schema: { type: integer } }
        - { name: minWarns, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [activity, bans, warns] } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: 회원
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Member' } }
                  hasNext: { type: boolean }
  /api/admin/members/{id}/sanctions:
    get:
      tags: [관리자 · 이용 정지]
      summary: 조치 이력
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 이력, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Sanction' } } } } }
    post:
      tags: [관리자 · 이용 정지]
      summary: 경고 · 정지 (WARNING / SUSPEND 1·3·5·10일 / BAN 영구)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SanctionInput' } } }
      responses:
        '200': { description: 바뀐 회원, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
  /api/admin/members/{id}/sanctions/active:
    delete:
      tags: [관리자 · 이용 정지]
      summary: 정지 해제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 바뀐 회원, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
  /api/admin/sanctions/bulk:
    post:
      tags: [관리자 · 이용 정지]
      summary: 여러 명 한꺼번에 조치
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SanctionInput'
                - type: object
                  required: [memberIds]
                  properties:
                    memberIds: { type: array, items: { type: string } }
      responses:
        '204': { description: 조치 완료 }
  /api/admin/posts:
    get:
      tags: [관리자 · 이용 정지]
      summary: 게시글 관리 목록 (댓글 · 신고 수 포함)
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/PostCategory' } }
        - { name: regionId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: reportedOnly, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200': { description: 글 목록, content: { application/json: { schema: { $ref: '#/components/schemas/PostPage' } } } }
  /api/admin/posts/{id}:
    delete:
      tags: [관리자 · 이용 정지]
      summary: 글 삭제 (관련 신고는 HIDDEN, 작성자 경고는 sanctions API 를 이어서)
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: reason, in: query, schema: { type: string, maxLength: 60 }, description: 삭제 사유 }
      responses:
        '204': { description: 삭제 완료 }
  /api/admin/posts/{id}/home-tip:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [관리자 · 이용 정지]
      summary: 홈 꿀팁으로 지정 (is_home_tip)
      responses:
        '204': { description: 지정 완료 }
    delete:
      tags: [관리자 · 이용 정지]
      summary: 홈 꿀팁 지정 풀기
      responses:
        '204': { description: 해제 완료 }
  /api/admin/posts/{id}/comments:
    post:
      tags: [관리자 · 이용 정지]
      summary: 운영자로 댓글 쓰기 (staff = true, 신고 · 수정 불가)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BodyInput' } } }
      responses:
        '200': { description: 쓴 댓글, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
  /api/admin/comments/{id}:
    delete:
      tags: [관리자 · 이용 정지]
      summary: 댓글 삭제 (관련 신고는 HIDDEN)
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: reason, in: query, schema: { type: string, maxLength: 60 }, description: 삭제 사유 }
      responses:
        '204': { description: 삭제 완료 }
  /api/admin/place-review-reports:
    get:
      tags: [관리자]
      summary: 장소 리뷰 신고 목록 (최신순 500건)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [RECEIVED, HIDDEN, DISMISSED] } }
      responses:
        '200': { description: 리뷰 신고 (review.deleted = 리뷰가 지금 없음) }
  /api/admin/place-review-reports/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [관리자]
      summary: 리뷰 신고 처리 — HIDDEN 은 리뷰 삭제 + 작성자 알림, DISMISSED 는 문제없음 (그 리뷰의 접수 중 신고 전부)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [HIDDEN, DISMISSED] }
      responses:
        '204': { description: 처리 완료 }
        '400': { description: status 확인, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 신고 없음, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/admin/reports:
    get:
      tags: [관리자 · 이용 정지]
      summary: 신고 관리 (프론트가 같은 대상끼리 묶어 보여 줌)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [RECEIVED, HIDDEN, DISMISSED] } }
      responses:
        '200': { description: 신고, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Report' } } } } }
    patch:
      tags: [관리자 · 이용 정지]
      summary: 같은 대상의 신고 한꺼번에 처리 ([문제없음] = DISMISSED, 내용 삭제 = HIDDEN)
      parameters:
        - { name: targetType, in: query, required: true, schema: { type: string, enum: [POST, COMMENT] } }
        - { name: targetId, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReportStatusInput' } } }
      responses:
        '204': { description: 처리 완료 }
  /api/admin/reports/{id}:
    patch:
      tags: [관리자 · 이용 정지]
      summary: 신고 하나 처리
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReportStatusInput' } } }
      responses:
        '204': { description: 처리 완료 }
  /api/notices:
    get:
      tags: [관리자 · 이용 정지]
      summary: 공지 목록 (고정 먼저, 새 것부터 · 내용 빼고)
      responses:
        '200': { description: 공지, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notice' } } } } }
  /api/notices/popups:
    get:
      tags: [관리자 · 이용 정지]
      summary: 앱을 열면 띄울 팝업 공지 (내용 포함)
      responses:
        '200': { description: 팝업 공지, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notice' } } } } }
  /api/notices/{id}:
    get:
      tags: [관리자 · 이용 정지]
      summary: 공지 내용
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 공지, content: { application/json: { schema: { $ref: '#/components/schemas/Notice' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/notices:
    post:
      tags: [관리자 · 이용 정지]
      summary: 공지 쓰기 (notify = true 면 알림을 켠 회원에게 알림)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NoticeInput' } } }
      responses:
        '201': { description: 쓴 공지, content: { application/json: { schema: { $ref: '#/components/schemas/Notice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/admin/notices/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [관리자 · 이용 정지]
      summary: 공지 고치기
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NoticeInput' } } }
      responses:
        '200': { description: 고친 공지, content: { application/json: { schema: { $ref: '#/components/schemas/Notice' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [관리자 · 이용 정지]
      summary: 공지 지우기
      responses:
        '204': { description: 삭제 완료 }

  # ───────────────────────── 12. 메모 ─────────────────────────
  /api/memo-folders:
    get:
      tags: [메모]
      summary: 내 메모 폴더 목록
      responses:
        '200':
          description: 본인 폴더만 반환
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemoFolder' }
    post:
      tags: [메모]
      summary: 메모 폴더 생성 (회원별 중복 이름 불가, 100개까지)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoFolderInput' }
      responses:
        '201':
          description: 생성된 폴더
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoFolder' }
  /api/memo-folders/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      tags: [메모]
      summary: 내 폴더 이름 변경
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoFolderInput' }
      responses:
        '200':
          description: 변경된 폴더
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoFolder' }
    delete:
      tags: [메모]
      summary: 내 폴더 삭제 (메모는 미분류로 보존)
      responses:
        '204': { description: 삭제 완료 }

  /api/memos:
    get:
      tags: [메모]
      summary: 메모 목록 (고정 먼저, 최근 수정 순)
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { description: 메모, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Memo' } } } } }
    post:
      tags: [메모]
      summary: 메모 쓰기 (빠른 메모는 body 만)
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/MemoInput' } } }
      responses:
        '201': { description: 쓴 메모, content: { application/json: { schema: { $ref: '#/components/schemas/Memo' } } } }
  /api/memos/{id}:
    patch:
      tags: [메모]
      summary: 메모 수정 (바꾼 칸만, items 는 통째로 — 0.5초 모아서 자동 저장)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemoUpdateInput' } } }
      responses:
        '200': { description: 바뀐 메모, content: { application/json: { schema: { $ref: '#/components/schemas/Memo' } } } }
    delete:
      tags: [메모]
      summary: 메모 삭제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: 삭제 완료 }
  /api/memos/ledger-draft:
    post:
      tags: [메모]
      summary: 가계부 메모 초안 준비 또는 기존 메모 다시 열기
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LedgerMemoDraftInput' } } }
      responses:
        '200':
          description: 메모 ID
          content: { application/json: { schema: { type: object, required: [id], properties: { id: { $ref: '#/components/schemas/RecordId' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/memos/ledger-draft/{key}:
    delete:
      tags: [메모]
      summary: 거래에 연결하기 전인 내 메모 폐기
      parameters:
        - { name: key, in: path, required: true, schema: { $ref: '#/components/schemas/LedgerMemoKey' } }
      responses:
        '204': { description: 폐기 처리 완료 }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/me/home-memos:
    get:
      tags: [메모]
      summary: 홈 메모 위젯에 보일 메모 · 순서 (null = 자동)
      responses:
        '200': { description: 메모 id, content: { application/json: { schema: { $ref: '#/components/schemas/HomeMemos' } } } }
    put:
      tags: [메모]
      summary: 홈 메모 위젯 설정 (최대 3개)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HomeMemos' } } }
      responses:
        '200': { description: 저장된 설정, content: { application/json: { schema: { $ref: '#/components/schemas/HomeMemos' } } } }

  # ───────────────────────── 13. 고객센터 ─────────────────────────
  /api/support/inquiries:
    get:
      tags: [고객센터]
      summary: 내 문의 목록
      responses:
        '200': { description: 문의, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Inquiry' } } } } }
    post:
      tags: [고객센터]
      summary: 1대1 문의 쓰기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, title, content]
              properties:
                category: { $ref: '#/components/schemas/InquiryCategory' }
                title: { type: string, maxLength: 100 }
                content: { type: string, maxLength: 3000 }
      responses:
        '201': { description: 쓴 문의, content: { application/json: { schema: { $ref: '#/components/schemas/Inquiry' } } } }
  /api/admin/support/inquiries:
    get:
      tags: [고객센터]
      summary: 전체 문의 목록 (관리자만)
      responses:
        '200': { description: 문의, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Inquiry' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/support/inquiries/{id}/answer:
    post:
      tags: [고객센터]
      summary: 문의 답변 (관리자만, 문의당 하나)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [content], properties: { content: { type: string, maxLength: 3000 } } } } }
      responses:
        '200': { description: 답변된 문의, content: { application/json: { schema: { $ref: '#/components/schemas/Inquiry' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: '12'
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    RecordId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RecordId' }
    QueryMonth:
      name: month
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Month' }
    TimeZone:
      name: timeZone
      in: query
      required: true
      schema: { type: string, example: Asia/Seoul }

  requestBodies:
    LedgerIncome:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/LedgerIncomeInput' } } }
    LedgerSpend:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/LedgerSpendInput' } } }

  responses:
    Auth:
      description: 로그인 성공
      headers:
        Set-Cookie:
          description: HttpOnly 재발급 쿠키
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, user]
            properties:
              accessToken: { type: string }
              user: { $ref: '#/components/schemas/User' }
    BadRequest:
      description: 입력이 잘못됨
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: 토큰 없음 · 만료 (프론트가 로그아웃)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: 권한 없음 (정지 · 동네 미인증 · 관리자 전용 · 남의 글)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: 없음 (남의 데이터 포함)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: 현재 저장 상태 또는 중복 기록과 충돌
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    HomeInfo:
      description: 내 집 설정·계약·대출 및 이자 기록
      content: { application/json: { schema: { $ref: '#/components/schemas/HomeInfo' } } }
    LedgerRows:
      description: 날짜와 ID의 내림차순으로 정렬된 해당 월의 기록
      content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LedgerRow' } } } }
    Like:
      description: 공감 상태
      content:
        application/json:
          schema:
            type: object
            properties:
              liked: { type: boolean }
              likes: { type: integer }

  schemas:
    RecordId:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '12'
    Month:
      type: string
      pattern: '^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$'
      example: '2026-11'
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string, example: 이미 가입된 이메일이에요. }
        code: { type: string, example: SUSPENDED, description: '정지 중이면 SUSPENDED → 프론트가 정지 화면으로' }
    IdList:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string }, example: ['1', '2'] }
    NameInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 24 }
    BodyInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 100 }
    RegionRef:
      type: object
      properties:
        id: { type: string, example: '2' }
        name: { type: string, example: 마포구 }
    EmailPurpose:
      type: string
      enum: [SIGNUP, FIND_ID, RESET_PASSWORD]

    # 인증 · 내 정보
    User:
      type: object
      required: [id, email, nickname, address, provider]
      properties:
        id: { type: string, example: '1' }
        username: { type: string, example: zipdemo, description: '소셜 가입자처럼 아이디가 없으면 키를 생략 (null 을 보내지 않음)' }
        email: { type: string, example: demo@zip.com, description: '소셜 회원처럼 없으면 빈 문자열 "" (현재 프론트 타입이 필수 문자열)' }
        nickname: { type: string, example: 지기 }
        birth: { type: string, format: date, nullable: true, example: '2000-02-29', description: '생년월일(user_personal_info). 개인 정보 행이 없으면 키를 생략하고, 행은 있는데 생일이 없으면 null' }
        address: { type: string, example: 서울시 마포구 합정동, description: '회원 주소(users.address). 등록된 주소가 없으면 빈 문자열 ""' }
        region:
          type: object
          nullable: true
          description: 회원 동네(users.region_id). 주소나 동네 인증으로 정해지고 없으면 null
          properties:
            id: { type: string, example: '8' }
            name: { type: string, example: 중구 }
            fullName: { type: string, example: 서울특별시 중구, description: '시 · 도를 붙인 이름. 다른 기기에서 인증한 회원의 날씨 · 지도 위치를 찾을 때 같은 이름의 다른 구와 구분' }
        regionVerifiedAt: { type: string, format: date-time, nullable: true, description: '동네 인증 시각. 30일 지났거나 동네가 바뀌면 null. 화면은 이 값과 region 으로 커뮤니티 입장 · 날씨 · 지도 동네를 정함' }
        provider: { type: string, enum: [email, kakao, google, naver] }
        role: { type: string, enum: [USER, ADMIN] }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        firstLogin: { type: boolean, description: 첫 주거 설문이 대기 중이면 true }
        agreedAt: { type: string, format: date-time, nullable: true, description: '소셜 첫 가입이면 null → 동의 화면(/welcome)' }
        bio: { type: string, maxLength: 30, description: 'user_profiles의 한 줄 소개, 없으면 빈 문자열' }
        avatarFileId: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true, description: 프로필 사진 조회 URL }
        avatarEmoji: { type: string, maxLength: 20, nullable: true, example: '🐻' }
        avatarColor: { type: string, nullable: true, pattern: '^#[0-9a-fA-F]{6}$', example: '#ffd6a5' }
        suspension:
          type: object
          nullable: true
          description: 'user_sanctions 의 진행 중 정지. 정지 중인 계정은 이 응답 전에 403 으로 막혀서 현재는 항상 null'
          properties:
            until: { type: string, format: date-time, nullable: true }
            permanent: { type: boolean }
            reason: { type: string }
            count: { type: integer }
        warnCount: { type: integer, description: '받은 경고(WARNING) 횟수' }
        banCount: { type: integer, description: '받은 정지(SUSPEND · BAN) 횟수' }
        unseenWarnings:
          type: array
          description: '확인 안 한 경고 → 앱에 들어올 때 경고 창'
          items:
            type: object
            properties:
              id: { type: string }
              reason: { type: string }
              at: { type: string, format: date-time }
    SignupRequest:
      type: object
      required: [username, password, nickname, email, emailVerificationToken, agreeTerms, agreePrivacy, agreePolicy, ageOver14, termsVersion]
      properties:
        username: { type: string, pattern: '^[a-z0-9]{6,16}$', example: tester01 }
        password: { type: string, format: password, minLength: 8, maxLength: 16, description: 영문 · 숫자 · 특수문자 모두 }
        nickname: { type: string, minLength: 2, maxLength: 12 }
        email: { type: string, format: email, maxLength: 100, description: '필수 (frontend/src/features/auth/schema.ts 와 같은 규칙), 겹치면 안 됨' }
        emailVerificationToken: { type: string, description: 이메일 인증 뒤 받은 값 }
        address: { type: string, maxLength: 200, nullable: true, description: '선택. 생략, null, 빈 문자열, 공백만 있는 문자열은 주소 미등록으로 처리. 현재 가입 화면에서는 생략.' }
        agreeTerms: { type: boolean, enum: [true] }
        agreePrivacy: { type: boolean, enum: [true] }
        agreePolicy: { type: boolean, enum: [true] }
        ageOver14: { type: boolean, enum: [true] }
        termsVersion: { type: string, minLength: 1, example: '2026-10-18', description: 서버가 동의 대상 약관 버전인지 검증 }
    UpdateMeRequest:
      type: object
      description: |
        프로필 수정에는 nickname, bio, avatarFileId, avatarEmoji, avatarColor 중 하나 이상을 보냅니다.
        생략한 프로필 필드는 유지하고, bio의 null은 빈 문자열로 처리합니다. 다른 선택 프로필 필드의 null은 기존 값을 지웁니다.
        사진은 본인 소유의 삭제되지 않은 JPEG/PNG만 연결할 수 있습니다.
        소셜 첫 동의에는 agreeTerms, agreePrivacy, agreePolicy, ageOver14를 모두 true로 보내고 유효한 termsVersion을 함께 보냅니다. 동의는 한 번만 가능합니다.
        약관 동의를 마친 회원은 약관 필드 없이 address를 보내 회원 주소를 변경할 수 있습니다.
      properties:
        nickname: { type: string, minLength: 2, maxLength: 12 }
        bio: { type: string, maxLength: 30, nullable: true }
        avatarFileId: { type: string, nullable: true }
        avatarEmoji: { type: string, maxLength: 20, nullable: true }
        avatarColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$', nullable: true }
        address: { type: string, maxLength: 200, nullable: true, description: '첫 동의에서는 선택이며, 생략하거나 null 또는 공백만 보내면 주소를 저장하지 않음. 현재 동의 화면에서는 생략. 주소 변경으로 보낼 때는 비어 있지 않은 주소가 필요.' }
        agreeTerms: { type: boolean, enum: [true] }
        agreePrivacy: { type: boolean, enum: [true] }
        agreePolicy: { type: boolean, enum: [true] }
        ageOver14: { type: boolean, enum: [true] }
        termsVersion: { type: string, minLength: 1 }

    # 설정
    Settings:
      type: object
      required: [rent, rentDay, moveIn, contractEnd, notiOn]
      description: 사용자 ID는 토큰으로 결정. regionLocation의 verified 출처는 실제 서버 인증 기록으로 검증하고 요청만으로 인증을 부여하지 않음. 동네 식별자와 표시명은 같은 동네를 가리켜야 하며 불일치는 400.
      properties:
        regionId: { type: string, nullable: true, example: '2' }
        regionName: { type: string, example: 서울 마포구 }
        homeAddress: { type: string, maxLength: 200, description: '실제 사는 상세 주소(user_settings.home_address). 회원 주소(users.address)와 동네 정보는 별도 필드로 관리. DB NULL이면 빈 문자열' }
        rent: { type: number, minimum: 0, maximum: 9999999999.9999, multipleOf: 0.0001, example: 55, description: 월세 (**만원 단위**), 55.0001은 550001원 }
        rentDay: { type: integer, minimum: 1, maximum: 31, example: 15 }
        moveIn: { type: string, example: '2026-02', description: 'YYYY-MM 또는 미설정 빈 문자열' }
        contractEnd: { type: string, example: '2027-02', description: 'YYYY-MM 또는 미설정 빈 문자열. 둘 다 설정하면 입주월 이상' }
        notiOn: { type: boolean }
        regionLocation: { $ref: '#/components/schemas/RegionLocation' }
    RegionLocation:
      type: object
      nullable: true
      description: '날씨 · 지도가 함께 쓰는 현재 동네와 좌표. DB user_settings.region_name · region_source · region_lat · region_lon. 소유자(userId)는 서버가 토큰으로 정해요. DB NULL 이면 null'
      required: [region, source]
      properties:
        region: { type: string, example: 서울 마포구 }
        source: { type: string, enum: [survey, verified, manual], description: '어디서 정했는지 — DB SURVEY · VERIFIED · MANUAL (대문자로 변환)' }
        point:
          type: object
          nullable: true
          description: 'lat · lon 은 둘 다 있거나 둘 다 없어야 해요. 인증 GPS · 설문 중심점이며 집 좌표(home)를 덮어쓰지 않아요'
          required: [lat, lon]
          properties:
            lat: { type: number, minimum: -90, maximum: 90, example: 37.5663 }
            lon: { type: number, minimum: -180, maximum: 180, example: 126.9019 }
    HomeInfoInput:
      type: object
      additionalProperties: false
      required: [kind, deposit, rent, rentDay, mgmtIncluded, mgmtFee, contractFee]
      description: 금액은 원 단위입니다. 대출 조건은 전세 계약에만 저장할 수 있습니다.
      properties:
        kind: { type: string, enum: [monthly, jeonse] }
        deposit: { type: integer, format: int64, minimum: 0, maximum: 9999990000 }
        rent: { type: integer, minimum: 0, maximum: 99990000 }
        rentDay: { type: integer, minimum: 1, maximum: 31 }
        mgmtIncluded: { type: boolean }
        mgmtFee: { type: integer, minimum: 0, maximum: 9990000 }
        contractFee: { type: integer, format: int64, minimum: 0, maximum: 9999990000 }
        moveIn: { type: string, pattern: '^(?:(?!0000)[0-9]{4}-(0[1-9]|1[0-2]))?$', default: '' }
        contractEnd: { type: string, pattern: '^(?:(?!0000)[0-9]{4}-(0[1-9]|1[0-2]))?$', default: '' }
        homeAddress: { type: string, maxLength: 200, nullable: true, description: 생략하면 유지하며 null이나 빈 문자열로 주소를 비웁니다. }
        loan: { $ref: '#/components/schemas/HousingLoanInput' }
    HousingLoanDraft:
      type: object
      nullable: true
      additionalProperties: false
      properties:
        principal: { type: integer, format: int64, minimum: 1, maximum: 9999990000, example: 100000000 }
        annualRate: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01, example: 3.5 }
        paymentDay: { type: integer, minimum: 1, maximum: 31, example: 25 }
        startDate: { type: string, format: date, example: '2026-03-01', description: '2000-01-01 ~ 2100-12-31' }
    HousingLoanInput:
      type: object
      nullable: true
      description: 원금은 원 단위이고 연 이율은 %입니다. null이면 기존 대출의 자동 기록을 중지합니다.
      required: [principal, annualRate, paymentDay, startDate]
      allOf:
        - $ref: '#/components/schemas/HousingLoanDraft'
    HousingLoan:
      type: object
      nullable: true
      required: [id, userId, principal, annualRate, paymentDay, startDate, active]
      properties:
        id: { type: string, format: uuid }
        userId: { $ref: '#/components/schemas/RecordId' }
        principal: { type: integer, format: int64 }
        annualRate: { type: number }
        paymentDay: { type: integer, minimum: 1, maximum: 31 }
        startDate: { type: string, format: date }
        active: { type: boolean }
    LoanInterestCharge:
      type: object
      required: [id, loanId, userId, date, amount, principal, annualRate]
      properties:
        id: { type: string, description: 대출 ID와 연월을 콜론으로 연결한 문자열 }
        loanId: { type: string, format: uuid }
        userId: { $ref: '#/components/schemas/RecordId' }
        date: { type: string, format: date, example: '2026-10-25' }
        amount: { type: integer, format: int64, description: 그달 이자 (원) }
        principal: { type: integer, format: int64, description: 기록 당시 원금 (원) }
        annualRate: { type: number, description: 기록 당시 연 이율 (%) }
    HomeContract:
      type: object
      nullable: true
      required: [kind, deposit, mgmtIncluded, mgmtFee, contractFee, managementBillId]
      properties:
        kind: { type: string, enum: [monthly, jeonse] }
        deposit: { type: integer, format: int64 }
        mgmtIncluded: { type: boolean }
        mgmtFee: { type: integer }
        contractFee: { type: integer, format: int64 }
        managementBillId: { type: string, nullable: true }
    HomeInfo:
      type: object
      required: [settings, contract, loan, loanDraft, charges, managementBill]
      properties:
        settings: { $ref: '#/components/schemas/Settings' }
        contract: { $ref: '#/components/schemas/HomeContract' }
        loan: { $ref: '#/components/schemas/HousingLoan' }
        loanDraft: { $ref: '#/components/schemas/HousingLoanDraft' }
        charges: { type: array, items: { $ref: '#/components/schemas/LoanInterestCharge' } }
        managementBill:
          oneOf:
            - $ref: '#/components/schemas/Bill'
            - { type: object, nullable: true, enum: [null] }
    HousingOnboardingInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action: { type: string, enum: [skip] }
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action: { type: string, enum: [save] }
            address: { type: string, maxLength: 200 }
            birth:
              oneOf:
                - { type: string, format: date, minLength: 10 }
                - { type: string, enum: [''] }
            timeZone: { type: string, maxLength: 100, default: Asia/Seoul, description: 월급 설정용 시간대 }
            salary:
              type: object
              additionalProperties: false
              required: [amount, incomePeriod]
              properties:
                amount: { type: integer, format: int64, minimum: 0, maximum: 11999999988 }
                incomePeriod: { type: string, enum: [monthly, annual] }
                paymentDay: { type: integer, minimum: 1, maximum: 31, description: 생략하면 월급 초안만 저장 }
            home:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [monthly, jeonse] }
                deposit: { type: integer, format: int64, minimum: 0, maximum: 9999990000 }
                rent: { type: integer, minimum: 0, maximum: 99990000 }
                mgmtIncluded: { type: boolean }
                mgmtFee: { type: integer, minimum: 0, maximum: 9990000 }
                contractFee: { type: integer, format: int64, minimum: 0, maximum: 9999990000 }
                loan:
                  type: object
                  description: 전세 대출 조건 일부만 보내면 초안으로 보관합니다. 대출 정보가 없으면 이 키를 생략합니다.
                  allOf:
                    - $ref: '#/components/schemas/HousingLoanDraft'
    LedgerScope:
      type: string
      enum: [fixed-income, other-income, spend, bill]
    MyLedgerCategories:
      type: object
      required: [custom, order, hidden, salaryLabel]
      properties:
        custom: { type: array, items: { $ref: '#/components/schemas/NameColor' } }
        order: { type: array, items: { type: string } }
        hidden: { type: array, items: { type: string } }
        salaryLabel: { type: string, nullable: true, description: 월급 표시 이름을 바꾼 경우의 이름 }
    LedgerCategoryChange:
      oneOf:
        - type: object
          required: [action, name]
          properties:
            action: { type: string, enum: [add, delete] }
            name: { type: string, minLength: 1, maxLength: 24 }
        - type: object
          required: [action, name, target]
          properties:
            action: { type: string, enum: [rename, move] }
            name: { type: string, minLength: 1, maxLength: 24 }
            target: { type: string, minLength: 1, maxLength: 24, description: 새 이름 또는 이동 기준 분류명 }
        - type: object
          required: [action]
          properties:
            action: { type: string, enum: [import] }
            previous:
              type: object
              nullable: true
              properties:
                custom: { type: array, items: { $ref: '#/components/schemas/NameColor' } }
                order: { type: array, items: { type: string } }
    NameColor:
      type: object
      required: [name, color]
      properties:
        name: { type: string, maxLength: 24, example: 배당 }
        color: { type: string, example: '#6485df' }

    # 일정
    TrashSchedule:
      type: object
      properties:
        place: { type: string, example: '내 집 혹은 내 점포 앞' }
        general: { $ref: '#/components/schemas/TrashKind' }
        food: { $ref: '#/components/schemas/TrashKind' }
        recycle: { $ref: '#/components/schemas/TrashKind' }
    TrashKind:
      description: 쓰레기 한 종류의 배출 요일 · 시작 시각. 그 장소에서 이 종류를 배출하지 않으면 null
      type: object
      nullable: true
      properties:
        days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 0=일 ~ 6=토, example: [1, 3, 5] }
        startTime: { type: string, example: '18:00', description: 배출 시작 시각 (종료 시각은 없음) }
    Event:
      type: object
      properties:
        id: { type: string, example: '31' }
        date: { type: string, format: date, example: '2026-10-24' }
        time: { type: string, example: '18:00', description: '빈 문자열이면 종일' }
        title: { type: string, maxLength: 60, example: 택배 반품 }
        category: { type: string, nullable: true, example: 연락·행정, description: 'null = 미분류' }
        done: { type: boolean }
        source: { type: string, enum: [USER, RENT] }
        anniv: { type: boolean, description: '기념일 (events.is_anniversary)' }
        yearly: { type: boolean, description: '매년 반복 (events.repeat_yearly)' }
    EventInput:
      type: object
      properties:
        date: { type: string, format: date }
        time: { type: string }
        title: { type: string, maxLength: 60 }
        category: { type: string, nullable: true }
        anniv: { type: boolean }
        yearly: { type: boolean }
    EventCategory:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: 집 관리 }
        ico: { type: string, example: '🏠' }
        items: { type: array, items: { type: string }, example: ['에어컨 필터 청소'] }
    EventPreset:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
    EventPresetInput:
      type: object
      required: [title, category]
      properties:
        title: { type: string }
        category: { type: string }

    # 월세 · 고정 지출
    Bill:
      type: object
      required: [id, name, amount, tag, paid, paidAt, month, defaultAmount, active, snapshot, dueDate, terminationDate, memo]
      properties:
        id: { type: string, example: '5' }
        name: { type: string, example: 전기 }
        amount: { type: integer, example: 32000, description: 그 달 금액 (납부 기록의 스냅샷) }
        tag: { type: string, maxLength: 24, example: 공과금 }
        paid: { type: boolean }
        paidAt: { type: string, format: date-time, nullable: true }
        month: { type: string, example: '2026-11' }
        defaultAmount: { type: integer, minimum: 0, maximum: 9007199254740991, description: 미생성 월의 예정 기본 금액 }
        active: { type: boolean, description: false이면 해지된 항목의 기존 월 기록 }
        snapshot: { type: boolean, description: true이면 저장된 월별 금액, false이면 기본 금액 기반 예정액 }
        dueDate: { type: string, format: date, nullable: true }
        terminationDate: { type: string, format: date, nullable: true }
        memo: { type: string, maxLength: 200 }
        memoId: { $ref: '#/components/schemas/RecordId' }
        memoTitle: { type: string }
        homeManaged: { type: boolean, description: '월별 고정 지출 목록(GET /api/bills/monthly)에서만. 내 집 정보(계약 · 관리비)가 관리하는 항목이면 true' }
    MonthlyBillCreate:
      type: object
      additionalProperties: false
      required: [tag, amount, dueDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 30, description: 생략하면 분류명 }
        tag: { type: string, minLength: 1, maxLength: 24 }
        amount: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        dueDate: { type: string, format: date }
        memo: { type: string, maxLength: 200 }
        memoId: { $ref: '#/components/schemas/RecordId' }
    MonthlyBillUpdate:
      type: object
      additionalProperties: false
      required: [amount, dueDate]
      properties:
        amount: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        dueDate: { type: string, format: date }
        memo: { type: string, maxLength: 200 }
        memoId: { $ref: '#/components/schemas/RecordId' }
    MonthlyBills:
      type: object
      required: [month, currentMonth, timeZone, periodFrom, periodThrough, queriedAt, contractKind, managementIncluded, contractPeriod, housingItems, items]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        currentMonth: { $ref: '#/components/schemas/Month' }
        timeZone: { type: string, example: Asia/Seoul }
        periodFrom: { type: string, description: 오프셋이 있는 ISO 8601 일시 (초는 생략될 수 있음), example: '2026-11-01T00:00+09:00' }
        periodThrough: { type: string, description: 오프셋이 있는 ISO 8601 일시 (초는 생략될 수 있음) }
        queriedAt: { type: string, description: 오프셋이 있는 ISO 8601 일시 (초는 생략될 수 있음) }
        contractKind: { type: string, nullable: true, enum: [monthly, jeonse, null] }
        managementIncluded: { type: boolean }
        contractPeriod:
          type: object
          required: [from, through, outside, currentOutside]
          properties:
            from: { type: string, nullable: true, example: '2026-10' }
            through: { type: string, nullable: true, example: '2027-10' }
            outside: { type: boolean, description: 조회 월이 계약 기간 밖인지 여부 }
            currentOutside: { type: boolean, description: 현재 월이 계약 기간 밖인지 여부 }
        housingItems: { type: array, items: { $ref: '#/components/schemas/HousingBill' } }
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Bill'
              - type: object
                required: [homeManaged]
                properties:
                  homeManaged: { type: boolean, description: 내 집 정보에서 관리하는 항목 }
    HousingBill:
      type: object
      required: [id, name, amount, tag, paid, paidAt, month, defaultAmount, active, snapshot, dueDate, source, memo]
      properties:
        id: { type: string, description: 'rent:YYYY-MM 또는 interest:{loanId}:YYYY-MM' }
        name: { type: string }
        amount: { type: integer, format: int64 }
        tag: { type: string }
        paid: { type: boolean }
        paidAt: { type: string, format: date-time, nullable: true }
        month: { $ref: '#/components/schemas/Month' }
        defaultAmount: { type: integer, format: int64 }
        active: { type: boolean }
        snapshot: { type: boolean }
        dueDate: { type: string, format: date, nullable: true }
        source: { type: string, enum: [rent, interest] }
        memo: { type: string }

    # 가계부
    LedgerRow:
      type: object
      required: [id, date, cat, amount, memo, salaryCategory, salaryManaged]
      properties:
        id: { $ref: '#/components/schemas/RecordId' }
        date: { type: string, format: date }
        cat: { type: string, maxLength: 24, example: 식비 }
        amount: { type: integer }
        memo: { type: string, maxLength: 100 }
        memoId: { $ref: '#/components/schemas/RecordId' }
        memoTitle: { type: string }
        salaryCategory: { type: boolean }
        salaryManaged: { type: boolean }
    LedgerIncomeInput:
      type: object
      additionalProperties: false
      required: [date, cat, amount, incomeType]
      properties:
        date: { type: string, format: date }
        cat: { type: string, minLength: 1, maxLength: 24 }
        amount: { type: integer, minimum: 1, maximum: 999999999 }
        memo: { type: string, maxLength: 100, default: '' }
        memoId: { $ref: '#/components/schemas/RecordId' }
        incomeType: { type: string, enum: [fixed, other] }
    LedgerSpendInput:
      type: object
      additionalProperties: false
      required: [date, cat, amount]
      properties:
        date: { type: string, format: date }
        cat: { type: string, minLength: 1, maxLength: 24 }
        amount: { type: integer, minimum: 1, maximum: 99999999 }
        memo: { type: string, maxLength: 100, default: '' }
        memoId: { $ref: '#/components/schemas/RecordId' }
    SalaryInput:
      type: object
      additionalProperties: false
      required: [amount, incomePeriod, paymentDay]
      properties:
        amount: { type: integer, format: int64, minimum: 0, maximum: 11999999988, description: '원 단위. 0은 중지, 월 기준 1~999999999원, 연 기준 12~11999999988원' }
        incomePeriod: { type: string, enum: [monthly, annual] }
        paymentDay: { type: integer, minimum: 1, maximum: 31 }
    SalarySettings:
      type: object
      required: [amount, incomePeriod, paymentDay, monthlyAmount, startMonth]
      properties:
        amount: { type: integer, format: int64 }
        incomePeriod: { type: string, enum: [monthly, annual] }
        paymentDay: { type: integer, minimum: 1, maximum: 31 }
        monthlyAmount: { type: integer, description: 월 환산 금액 (원) }
        startMonth: { type: string, description: 'YYYY-MM 또는 미설정 빈 문자열' }
        draft:
          type: object
          description: 첫 주거 설문에서 수령일 없이 저장한 월급 초안
          required: [amount, incomePeriod]
          properties:
            amount: { type: integer, format: int64 }
            incomePeriod: { type: string, enum: [monthly, annual] }

    # 알림
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [EVENT, TRASH, RENT, BILL, COMMUNITY, SYSTEM], description: 'TRASH(쓰레기 배출일 알림)는 2026-11-28 에 없앰. 그 전에 만들어진 알림만 남아 있을 수 있음' }
        title: { type: string, example: 월세 납부일이 3일 남았어요 }
        body: { type: string, example: 매월 15일 · 55만원 }
        link: { type: string, example: budget }
        refId: { type: string, nullable: true }
        notifyAt: { type: string, format: date-time }
        read: { type: boolean }

    # 커뮤니티
    PostCategory:
      type: string
      enum: [FREE, TIP, QUESTION, TOWN]
      description: 자유 · 꿀팁 · 질문 · 동네
    Author:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string }
    Attachment:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: before.jpg }
        type: { type: string, example: image/jpeg }
        size: { type: integer, example: 183000 }
        url: { type: string }
    Comment:
      type: object
      properties:
        id: { type: string }
        author: { $ref: '#/components/schemas/Author' }
        body: { type: string, maxLength: 100 }
        mine: { type: boolean }
        staff: { type: boolean, description: '운영자 댓글 → ''운영자'' 표시, 신고 · 수정 불가' }
        createdAt: { type: string, format: date-time }
    Post:
      type: object
      properties:
        id: { type: string, example: '10' }
        region: { $ref: '#/components/schemas/RegionRef' }
        category: { $ref: '#/components/schemas/PostCategory' }
        title: { type: string, maxLength: 60 }
        body: { type: string, maxLength: 500 }
        author: { $ref: '#/components/schemas/Author' }
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        likes: { type: integer }
        liked: { type: boolean }
        commentCount: { type: integer }
        views: { type: integer, format: int64, minimum: 0 }
        reported: { type: boolean, description: 내가 이 글을 신고했는지 }
        homeTip: { type: boolean, description: 관리자가 홈 꿀팁으로 지정한 글인지 }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }
    PostInput:
      type: object
      required: [category, title, body]
      properties:
        category: { $ref: '#/components/schemas/PostCategory' }
        title: { type: string, maxLength: 60 }
        body: { type: string, maxLength: 500 }
        attachmentIds: { type: array, maxItems: 5, items: { type: string } }
    PostPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Post' } }
        hasNext: { type: boolean }
        suggestedQuery:
          type: string
          description: 회원 게시글 검색의 첫 페이지가 0건인 경우, 같은 동네·카테고리에서 공개 글이 있는 교정 후보가 하나일 때만 반환합니다.
    ReportReason:
      type: string
      enum: [ABUSE, FALSE_INFO, PRIVACY, AD_ILLEGAL, COPYRIGHT, OTHER]
      description: 욕설·비방 · 거짓 정보 · 개인정보 노출 · 광고·불법 · 저작권 · 기타
    Report:
      type: object
      properties:
        id: { type: string }
        targetType: { type: string, enum: [POST, COMMENT] }
        targetId: { type: string }
        target:
          type: object
          properties:
            title: { type: string, description: 글이면 }
            text: { type: string, description: 댓글이면 }
            author: { type: string }
            deleted: { type: boolean }
        reason: { $ref: '#/components/schemas/ReportReason' }
        detail: { type: string }
        reporter: { type: string }
        status: { type: string, enum: [RECEIVED, HIDDEN, DISMISSED] }
        createdAt: { type: string, format: date-time }
    ReportStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [HIDDEN, DISMISSED] }

    # AI
    AiMessage:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [USER, ASSISTANT] }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        card:
          type: object
          nullable: true
          description: 'SPEND_SUMMARY = 지출 요약 숫자, LINK = 화면 바로가기 버튼 { label, to }'
          properties:
            type: { type: string, enum: [SPEND_SUMMARY, LINK] }
            data:
              description: 'type 이 SPEND_SUMMARY 면 SpendSummaryCard, LINK 면 LinkCard. 보낸 그때의 숫자를 ai_messages.card_data 에 저장'
              oneOf:
                - $ref: '#/components/schemas/SpendSummaryCard'
                - $ref: '#/components/schemas/LinkCard'
    SpendSummaryCard:
      type: object
      required: [month, total, prevTotal, fixed, rows, top]
      properties:
        month: { type: integer, minimum: 1, maximum: 12, example: 10 }
        total: { type: integer, example: 1180000, description: 이번 달 지출 합계 (원) }
        prevTotal: { type: integer, example: 1090000, description: 지난달 지출 합계 (원) }
        fixed: { type: integer, example: 620000, description: 고정 지출 합계 (원) }
        rows:
          type: array
          description: '[분류 이름, 금액] 목록'
          items: { type: array, minItems: 2, maxItems: 2, items: { oneOf: [{ type: string }, { type: integer }] } }
          example: [[월세, 550000], [식비, 210000]]
        top:
          type: array
          nullable: true
          description: '가장 많이 쓴 [분류 이름, 금액]'
          minItems: 2
          maxItems: 2
          items: { oneOf: [{ type: string }, { type: integer }] }
          example: [식비, 210000]
    LinkCard:
      type: object
      required: [label, to]
      properties:
        label: { type: string, example: '월세·공과금 (고정 지출) 바로가기' }
        to: { type: string, example: /my/budget/expense, description: '앱 화면 주소 (/my/calendar · /my/budget/expense · /map · /community · /ai 등)' }

    # 지도
    Place:
      type: object
      properties:
        id: { type: string }
        category: { type: string, example: 세탁방 }
        name: { type: string, example: 코인빨래방 합정점 }
        description: { type: string, example: '도보 약 3분 · 24시간' }
        lat: { type: number }
        lon: { type: number }
        walkMin: { type: integer, description: '우리 집(users.home_lat · home_lon) 기준 도보 분 — 직선 거리 ÷ 분당 67m. 집 좌표가 없으면 설명의 "도보 약 N분", 그것도 없으면 99' }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        openHours: { type: string, nullable: true }
        rating: { type: number, nullable: true }
        reviewCount: { type: integer }
    MapSettings:
      type: object
      properties:
        categories: { type: array, items: { type: string }, example: [세탁방, 편의점, 약국, 마트] }
        keywords: { type: array, items: { type: string }, example: [빵집] }

    # 관리자
    Member:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string }
        username: { type: string, description: 아이디가 없으면 키 생략 }
        joinedAt: { type: string, format: date }
        posts: { type: integer }
        comments: { type: integer }
        warns: { type: integer }
        bans: { type: integer }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        until: { type: string, format: date-time, nullable: true }
        permanent: { type: boolean }
    Sanction:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [WARNING, SUSPEND, BAN] }
        days: { type: integer, nullable: true }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
    SanctionInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [WARNING, SUSPEND, BAN] }
        days: { type: integer, enum: [1, 3, 5, 10], nullable: true, description: SUSPEND 일 때만 }
        reason: { type: string, maxLength: 60 }

    # 메모
    MemoItem:
      type: object
      properties:
        text: { type: string, maxLength: 100 }
        done: { type: boolean }
    Memo:
      type: object
      properties:
        id: { type: string }
        folderId: { type: string, nullable: true, description: 'null은 미분류' }
        ledgerContext: { type: string, nullable: true }
        draft: { type: boolean, description: 작성 중인 가계부 메모인지 여부 }
        title: { type: string, maxLength: 60 }
        body: { type: string, maxLength: 5000 }
        color: { type: string, enum: [노랑, 분홍, 하늘, 초록, 보라, 흰색] }
        pinned: { type: boolean }
        checklist: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/MemoItem' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MemoFolder:
      type: object
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 40 }
    MemoFolderInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
    MemoInput:
      type: object
      properties:
        title: { type: string, maxLength: 60 }
        body: { type: string, maxLength: 5000 }
        color: { type: string, enum: [노랑, 분홍, 하늘, 초록, 보라, 흰색] }
        pinned: { type: boolean }
        checklist: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/MemoItem' } }
        folderId: { type: string, nullable: true, description: '생략/null은 유지, 빈 문자열은 미분류, 문자열 ID는 본인 폴더로 이동' }
    MemoUpdateInput:
      allOf:
        - $ref: '#/components/schemas/MemoInput'
        - type: object
          properties:
            complete: { type: boolean, description: true이면 작성 중인 가계부 메모를 확정 }
    LedgerMemoKey:
      type: string
      pattern: '^[a-fA-F0-9]{32}$'
    LedgerMemoDraftInput:
      type: object
      required: [kind, label]
      anyOf:
        - required: [key]
        - required: [memoId]
      properties:
        kind: { type: string, enum: [income, spend, bill] }
        label: { type: string, minLength: 1, maxLength: 120 }
        key: { $ref: '#/components/schemas/LedgerMemoKey' }
        incomeType: { type: string, enum: [fixed, other], default: fixed, description: 새 수입 초안의 폴더 선택에 사용 }
        memoId: { $ref: '#/components/schemas/RecordId' }
    HomeMemos:
      type: object
      properties:
        ids: { type: array, maxItems: 3, items: { type: string }, nullable: true, description: 'null = 자동 (고정 → 최근 수정 3개)' }

    # 고객센터
    InquiryCategory:
      type: string
      enum: [이용 문의, 오류 신고, 개선 제안, 계정 문의, 기타]
    ProfileInfo:
      type: object
      properties:
        username: { type: string, description: 로그인 아이디 }
        email: { type: string, nullable: true }
        nickname: { type: string }
        birth: { type: string, format: date, nullable: true }
    RegionBrief:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: 마포구 }
        sido: { type: string, example: 서울특별시 }
    PlaceList:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
        placeIds: { type: array, items: { type: string } }
    PlaceListInput:
      type: object
      properties:
        name: { type: string }
        color: { type: string }
    Notice:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string, description: 목록에서는 빠짐 }
        pinned: { type: boolean }
        popup: { type: boolean }
        author: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NoticeInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 100 }
        body: { type: string, maxLength: 5000 }
        pinned: { type: boolean }
        popup: { type: boolean, description: 앱을 열면 띄움 (최대 5개) }
        notify: { type: boolean, description: true 면 알림을 켠 회원에게 공지 알림 }
    Inquiry:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        nickname: { type: string }
        category: { $ref: '#/components/schemas/InquiryCategory' }
        title: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        answer:
          type: object
          nullable: true
          properties:
            content: { type: string }
            createdAt: { type: string, format: date-time }
