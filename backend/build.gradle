plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.zip'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.58.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.google.zxing:javase:3.5.4'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'mysql' }
    // Windows 기본 인코딩(cp949)에서는 테스트용 SQL의 한글이 깨져 지역 조회 테스트가 실패한다. 테스트 JVM을 UTF-8로 고정해 PC 설정과 상관없이 같은 결과가 나오게 한다.
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.register('mysqlTest', Test) {
    group = 'verification'
    description = 'Run Flyway and JPA integration tests on a throwaway MySQL container.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'mysql' }
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.register('hashPassword', JavaExec) {
    group = 'application'
    description = 'Generate a BCrypt hash for an explicitly provisioned local test account.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.zip.backend.tools.PasswordHash'
    standardInput = System.in
}

tasks.named('processResources') {
    from('../db/flyway') {
        include 'V*.sql'
        into 'db/migration'
    }
    from('../db/migrations') {
        def baselineData = [
            '20261122_01_regions_nationwide.sql': 'V2__nationwide_regions.sql',
            '20261122_02_trash_schedules_nationwide.sql': 'V3__nationwide_trash_schedules.sql',
            '20261122_04_region_neighbors_nationwide.sql': 'V4__nationwide_region_neighbors.sql',
        ]
        include baselineData.keySet()
        rename { baselineData[it] }
        filteringCharset = 'UTF-8'
        filter { line -> line == 'USE `zip`;' ? null : line }
        into 'db/migration'
    }
}

['Info', 'Baseline', 'Migrate'].each { command ->
    tasks.register("flyway${command}", JavaExec) {
        group = 'database'
        description = "Run Flyway ${command.toLowerCase(Locale.ROOT)} against the configured MySQL database."
        classpath = sourceSets.main.runtimeClasspath
        javaLauncher = javaToolchains.launcherFor(java.toolchain)
        mainClass = 'com.zip.backend.tools.DatabaseMigration'
        args command.toLowerCase(Locale.ROOT)
    }
}
