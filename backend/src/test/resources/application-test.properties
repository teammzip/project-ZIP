spring.config.import=
spring.datasource.url=jdbc:h2:mem:zip_auth;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
zip.auth.jwt-secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
zip.files.directory=./build/test-uploads

zip.bills.auto-register.enabled=false

# 쓰레기 배출 아침 알림 스케줄러는 테스트에서 끔 (TrashReminderTests 가 시각을 직접 넘겨 확인)
zip.trash.reminder.enabled=false
zip.rent.reminder.enabled=false
# 오래된 데이터 정리 스케줄러도 끔 (DataCleanupTests 가 시각을 직접 넘겨 확인)
zip.cleanup.enabled=false
# Rate limits are tested in RateLimitTests with small values; other tests send/upload freely
zip.mail.ip-per-window=1000
zip.mail.ip-per-day=1000
zip.mail.global-per-hour=1000
zip.mail.global-per-day=1000
zip.files.daily-limit=1000
zip.files.pending-limit=1000
