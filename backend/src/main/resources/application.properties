spring.application.name=backend

# Local credentials stay outside source control. Environment variables take precedence.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties,optional:file:../secrets/google.properties,optional:file:./secrets/google.properties,optional:file:../secrets/naver.properties,optional:file:./secrets/naver.properties,optional:file:../secrets/kakao.properties,optional:file:./secrets/kakao.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zip?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Manage the existing schema through db/schema.sql and db/migrations, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Base64-encoded random secret (at least 32 bytes). No default signing key.
zip.auth.jwt-secret=${JWT_SECRET}
zip.auth.issuer=zip-backend
zip.auth.access-seconds=3600
zip.auth.remember-access-seconds=604800

# Kakao Local REST API key. Empty = map uses only places already in the DB.
zip.kakao.rest-key=${KAKAO_REST_KEY:}
zip.files.directory=${ZIP_UPLOAD_DIR:./var/uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Google social login. Leave GOOGLE_CLIENT_ID empty to disable it (the app still starts).
zip.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
zip.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# Naver social login. Leave NAVER_CLIENT_ID empty to disable it.
zip.oauth.naver.client-id=${NAVER_CLIENT_ID:}
zip.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
# Kakao social login (REST API key + Client Secret of the Kakao Login app). Empty = disabled.
# Not the same setting as KAKAO_REST_KEY above (that one is for map place search).
zip.oauth.kakao.client-id=${KAKAO_LOGIN_CLIENT_ID:}
zip.oauth.kakao.client-secret=${KAKAO_LOGIN_CLIENT_SECRET:}
# Where the browser is sent after social login: <frontend-url>/oauth/callback?token=...
zip.oauth.frontend-url=${FRONTEND_URL:http://localhost:3000}
