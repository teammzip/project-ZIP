spring.application.name=backend

# Local credentials stay outside source control. Environment variables take precedence.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties,optional:file:../secrets/google.properties,optional:file:./secrets/google.properties,optional:file:../secrets/naver.properties,optional:file:./secrets/naver.properties,optional:file:../secrets/kakao.properties,optional:file:./secrets/kakao.properties,optional:file:../secrets/gemini.properties,optional:file:./secrets/gemini.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zip?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Manage the existing schema through db/schema.sql and db/migrations, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Base64-encoded random secret (at least 32 bytes). No default signing key.
zip.auth.jwt-secret=${JWT_SECRET}
zip.auth.issuer=zip-backend
zip.auth.access-seconds=900
zip.auth.session-seconds=43200
zip.auth.remember-session-seconds=604800
# Set true when HTTPS terminates at a reverse proxy and the backend receives HTTP.
zip.auth.cookie-secure=${ZIP_AUTH_COOKIE_SECURE:false}

# Kakao Local REST API key. Empty = map uses only places already in the DB.
zip.kakao.rest-key=${KAKAO_REST_KEY:}
# Kakao free-quota guard (map/KakaoQuota): calls per user per minute, calls per server per day (Korea time)
zip.kakao.per-user-per-minute=${KAKAO_PER_USER_PER_MINUTE:30}
zip.kakao.daily-limit=${KAKAO_DAILY_LIMIT:30000}

# Trash-day reminder (notification/TrashReminderService): home address → district → trash_schedules, at this hour (Korea time, 0 = midnight of the trash day)
zip.trash.reminder.enabled=${TRASH_REMINDER_ENABLED:true}
zip.trash.reminder-hour=${TRASH_REMINDER_HOUR:0}

# AI chat (Google Gemini). Without a key the endpoint answers 503 and the app falls back to its demo answers.
zip.gemini.api-key=${GEMINI_API_KEY:}
zip.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
zip.ai.daily-limit=${AI_DAILY_LIMIT:30}
zip.files.directory=${ZIP_UPLOAD_DIR:./var/uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Email verification codes (sign-up, find id, reset password). Gmail SMTP by default (app password, not the login password).
# Without MAIL_USERNAME/MAIL_PASSWORD no mail can be sent: the request fails with 503 unless MAIL_LOG_ONLY=true (development).
zip.mail.username=${MAIL_USERNAME:}
zip.mail.password=${MAIL_PASSWORD:}
# 개발 전용: true 이면 메일 설정이 없을 때 인증번호를 서버 로그에만 남긴다. 운영에서는 반드시 false(기본값).
zip.mail.log-only=${MAIL_LOG_ONLY:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# 암호화(STARTTLS)를 반드시 쓰게 한다. 서버가 지원하지 않으면 평문으로 내려가지 않고 발송을 실패시켜서 앱 비밀번호가 평문으로 새는 것을 막는다.
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Google social login. Leave GOOGLE_CLIENT_ID empty to disable it (the app still starts).
zip.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
zip.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# Naver social login. Leave NAVER_CLIENT_ID empty to disable it.
zip.oauth.naver.client-id=${NAVER_CLIENT_ID:}
zip.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
# Kakao social login (REST API key + Client Secret of the Kakao Login app). Empty = disabled.
# Not the same setting as KAKAO_REST_KEY above (that one is for map place search).
zip.oauth.kakao.client-id=${KAKAO_LOGIN_CLIENT_ID:}
zip.oauth.kakao.client-secret=${KAKAO_LOGIN_CLIENT_SECRET:}
# Where the browser is sent after social login: <frontend-url>/oauth/callback#token=...
zip.oauth.frontend-url=${FRONTEND_URL:http://localhost:3000}
