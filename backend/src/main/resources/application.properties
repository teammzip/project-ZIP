spring.application.name=backend

# Local credentials stay outside source control. Environment variables take precedence.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zip?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Manage the existing schema through db/schema.sql and db/migrations, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
